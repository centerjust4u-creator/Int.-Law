<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Int. Law Quiz 6 — Center JUST</title>
<style>
:root{--navy:#060E24;--navy2:#0c1838;--gold:#D6B158;--gold2:#a98a3d;--parch:#f4ecd8;--parch2:#e9dcb9;--ink:#1b2236;--blue:#1f5fd1;--red:#c93a3a;--mute:#A9B6D3;--text:#F4F7FC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--navy);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 85% -10%,rgba(36,84,190,.28),transparent 55%),radial-gradient(ellipse at 10% 110%,rgba(214,177,88,.07),transparent 50%),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45))}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1px solid rgba(214,177,88,.5)}
header img{width:44px;height:44px;object-fit:contain}
header .nm{font-family:Georgia,"Times New Roman",serif;font-size:22px;letter-spacing:.5px;color:var(--gold)}
header .lab{margin-left:auto;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
.screen{display:none;animation:fade .45s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:34px 0 10px}
.hero img{width:170px;height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.brand{font-family:Georgia,serif;font-size:26px;color:var(--gold);letter-spacing:2px;margin:10px 0 2px}
.pres{font-size:11px;letter-spacing:.3em;color:var(--mute);margin-top:18px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:38px;margin:8px 0 6px;color:var(--text)}
.rule{width:90px;height:2px;background:var(--gold);margin:12px auto}
.sub{color:var(--mute);max-width:440px;margin:0 auto 22px;line-height:1.5}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid rgba(214,177,88,.55);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 18px;min-width:96px}
.chip b{display:block;font-family:Georgia,serif;font-size:26px;color:var(--gold)}
.chip span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,#e6c36f,var(--gold2));color:#1a1405;border:0;border-radius:12px;padding:15px 34px;font-weight:700;font-size:17px;letter-spacing:.06em;box-shadow:0 6px 22px rgba(214,177,88,.25);transition:transform .15s,box-shadow .15s;min-height:50px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(214,177,88,.38)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.meta{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 12px;font-size:14px;letter-spacing:.08em;color:var(--mute)}
.meta .sc{color:var(--gold);font-weight:700}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;padding:26px 22px;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(214,177,88,.12),0 18px 44px rgba(0,0,0,.5)}
.type{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7a5f1c;border:1px solid #a98a3d;border-radius:20px;padding:3px 11px;margin-bottom:12px}
.qt{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.45;margin:0 0 20px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:#fffaf0;color:var(--ink);border:1.5px solid #cdb98a;border-radius:12px;padding:13px 15px;font-size:16.5px;line-height:1.35;min-height:54px;transition:transform .12s,border-color .12s,background .2s,opacity .3s}
.opt:hover:not(:disabled){border-color:var(--gold2);transform:translateX(4px);background:#fff}
.opt .b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy2);color:var(--gold);display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.ok{background:var(--blue);border-color:var(--blue);color:#fff}.opt.ok .b{background:#fff;color:var(--blue)}
.opt.no{background:var(--red);border-color:var(--red);color:#fff;animation:shake .4s}.opt.no .b{background:#fff;color:var(--red)}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;padding:13px 15px;border-radius:12px;font-size:15.5px;line-height:1.45;display:none}
.fb.show{display:block;animation:fade .3s}
.fb.good{background:rgba(31,95,209,.12);border:1px solid var(--blue);color:#12357a}
.fb.bad{background:rgba(201,58,58,.1);border:1px solid var(--red);color:#7d1e1e}
.fb b{font-family:Georgia,serif;font-size:17px}
.nx{display:flex;justify-content:flex-end;margin-top:16px}
.res{text-align:center;padding:30px 0}
.res img{width:96px}
.big{font-family:Georgia,serif;font-size:76px;color:var(--gold);line-height:1;margin:8px 0}
.res p{color:var(--mute);font-size:18px;margin:6px 0 22px}
.msg{font-family:Georgia,serif;font-size:20px;margin-bottom:6px}
footer{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.14em;padding:26px 0 0;opacity:.8}
@media(max-width:560px){h1{font-size:30px}.qt{font-size:19px}.card{padding:20px 15px}.hero img{width:140px}header .nm{font-size:19px}.btn{width:100%}.nx{display:block}.opt{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

var DATA=[{"t": "tf", "q": "The primary purpose of treaty interpretation is to clarify the meaning of provisions that are ambiguous, unclear, or disputed.", "a": true}, {"t": "tf", "q": "Interpretation allows an interpreter to add new obligations to a treaty even if those obligations were never expressed or agreed upon by the parties.", "a": false}, {"t": "tf", "q": "The rules and methods of treaty interpretation are applied automatically and have an obligatory character for every interpreter.", "a": false}, {"t": "tf", "q": "The natural meaning rule requires treaty provisions to be interpreted according to their ordinary and plain meaning.", "a": true}, {"t": "tf", "q": "Under the context rule, treaty provisions should be interpreted independently without considering the preamble or other articles.", "a": false}, {"t": "tf", "q": "The principle of effectiveness requires choosing an interpretation that gives practical effect to a treaty provision rather than rendering it meaningless.", "a": true}, {"t": "tf", "q": "According to the contra proferentem rule, an ambiguous provision should be interpreted in favor of the party that drafted it.", "a": false}, {"t": "tf", "q": "The ultimate objective of treaty interpretation is to determine the true common intention of the contracting parties at the time the treaty was concluded.", "a": true}, {"t": "tf", "q": "Extrinsic means of interpretation may be used when ambiguity remains after applying intrinsic rules.", "a": true}, {"t": "tf", "q": "Subsequent practice may provide objective evidence of the parties' understanding of a treaty, particularly when their conduct establishes agreement regarding its interpretation.", "a": true}, {"t": "tf", "q": "Preparatory work may be used to change the clear and ordinary meaning of a treaty provision whenever the negotiating history suggests a different intention.", "a": false}, {"t": "tf", "q": "Analogy is frequently used in international treaty interpretation because international obligations do not require the explicit consent of states.", "a": false}, {"t": "tf", "q": "When a multilingual treaty does not specify which language prevails, the general rule is that the languages in which it was drawn up have equal authority.", "a": true}, {"t": "tf", "q": "Under the principle of in dubio mitius, an ambiguous treaty obligation should generally be interpreted in the manner that imposes the greatest burden on the obligated party.", "a": false}, {"t": "tf", "q": "An interpretation issued by an international court is automatically considered authentic interpretation, even without an agreement between the contracting parties.", "a": false}, {"t": "mc", "q": "What is the main purpose of interpreting international treaties?", "o": ["To create new international obligations", "To clarify the true meaning of ambiguous provisions", "To replace existing treaties with new agreements", "To eliminate the consent of contracting parties"], "a": 1}, {"t": "mc", "q": "Which of the following is considered an intrinsic means of treaty interpretation?", "o": ["Preparatory work", "Subsequent practice", "The natural meaning rule", "Recourse to analogy"], "a": 2}, {"t": "mc", "q": "According to the natural meaning rule, treaty provisions should primarily be interpreted:", "o": ["According to the personal opinions of judges", "According to their ordinary and plain meaning", "According to the interests of the stronger state", "According to the negotiating history alone"], "a": 1}, {"t": "mc", "q": "A treaty provision states that a country must pay \"500 million pounds,\" without specifying the currency. The preamble refers to Egyptian debt. Which principle is most relevant to determining the intended currency?", "o": ["Contra proferentem", "Recourse to analogy", "The context of the treaty", "Authentic interpretation"], "a": 2}, {"t": "mc", "q": "The maxim ut res magis valeat quam pereat expresses which principle?", "o": ["The principle of effectiveness", "The principle of state sovereignty", "The principle of equality of languages", "The principle of restrictive interpretation"], "a": 0}, {"t": "mc", "q": "According to the contra proferentem rule, an ambiguous treaty provision should be interpreted:", "o": ["Against the party that drafted the provision", "In favor of the party that drafted the provision", "According to the decision of a third state", "Without considering the drafting party"], "a": 0}, {"t": "mc", "q": "Which of the following is NOT an extrinsic means of treaty interpretation?", "o": ["Subsequent practice", "Preparatory work", "Recourse to analogy", "The context of the treaty"], "a": 3}, {"t": "mc", "q": "Two states conclude a treaty requiring payment in \"pounds.\" One state repeatedly pays in Egyptian pounds, and the other accepts these payments without objection. Which method of interpretation is illustrated?", "o": ["Natural meaning", "Subsequent practice", "Restrictive interpretation", "Recourse to analogy"], "a": 1}, {"t": "mc", "q": "Which of the following is an example of travaux préparatoires?", "o": ["A judgment issued several years after the treaty", "The subsequent conduct of contracting parties", "Preliminary drafts and records of negotiations", "The ordinary dictionary meaning of a treaty term"], "a": 2}, {"t": "mc", "q": "In which situation should preparatory work NOT be used to interpret a treaty?", "o": ["When the treaty provision is ambiguous", "When the negotiating history clarifies the parties' intention", "When the text is already clear and unambiguous", "When the preparatory documents confirm the meaning of the text"], "a": 2}, {"t": "mc", "q": "Why is recourse to analogy generally rare in international treaty interpretation?", "o": ["Because international treaties are based on the explicit consent of the parties", "Because international law prohibits all comparisons between treaties", "Because analogy always produces identical legal obligations", "Because treaties are never ambiguous"], "a": 0}, {"t": "mc", "q": "A treaty is drafted in English and French, and both texts are equally authentic. The English text imposes a broader obligation than the French text. Which interpretation is generally preferred when reconciling the two texts?", "o": ["The broader interpretation", "The interpretation preferred by the stronger state", "The narrower interpretation reflecting their common meaning", "The interpretation contained in the English text automatically"], "a": 2}, {"t": "mc", "q": "The principle of in dubio mitius means that:", "o": ["All international obligations must be interpreted extensively", "Ambiguous obligations should be interpreted in the less burdensome manner", "International treaties must always be interpreted literally", "The intention of the contracting parties is irrelevant"], "a": 1}, {"t": "mc", "q": "An international organization's charter grants it certain functions but does not expressly mention all the powers necessary to perform them. Which theory may justify recognizing those necessary powers?", "o": ["Contra proferentem", "The natural meaning rule", "The implied powers theory", "The principle of equal authenticity"], "a": 2}, {"t": "mc", "q": "After concluding a treaty, the contracting states reach a mutual agreement clarifying the meaning of one of its provisions. This is an example of:", "o": ["Judicial interpretation", "Institutional interpretation", "Interpretation by analogy", "Authentic interpretation"], "a": 3}];

  var b=document.createElement("button");b.className="opt";b.type="button";
  var s=document.createElement("span");s.className="b";s.textContent=q.t==="tf"?(k===0?"T":"F"):L[k];
  var x=document.createElement("span");x.textContent=t;b.appendChild(s);b.appendChild(x);
  b.onclick=function(){answer(k)};box.appendChild(b)});
 $("fb").className="fb";$("fb").innerHTML="";
 $("next").style.display="none";
 $("next").textContent=i===order.length-1?"See result":"Next question";
}
function answer(k){
 if(locked)return;locked=true;var q=order[i];
 var ci=q.t==="tf"?(q.a?0:1):q.a;var ok=k===ci;if(ok)correct++;
 var bs=$("opts").children;
 for(var j=0;j<bs.length;j++){bs[j].disabled=true;
  if(j===ci)bs[j].classList.add("ok");else if(j===k)bs[j].classList.add("no");else bs[j].classList.add("dim")}
 var ctext=q.t==="tf"?(q.a?"True":"False"):L[ci]+". "+q.o[ci];
 var fb=$("fb");fb.className="fb show "+(ok?"good":"bad");
 fb.innerHTML="";var h=document.createElement("b");h.textContent=ok?"Correct!":"Not quite.";fb.appendChild(h);
 if(!ok){fb.appendChild(document.createElement("br"));fb.appendChild(document.createTextNode("Correct answer: "+ctext))}
 $("score").textContent="Correct: "+correct;
 $("bar").style.width=((i+1)/order.length*100)+"%";
 $("next").style.display="inline-block";$("next").focus({preventScroll:true});
 $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){if(!locked)return;i++;if(i>=order.length)finish();else render()}
function finish(){
 var n=order.length,p=Math.round(correct/n*100);
 $("pct").textContent=p+"%";$("fin").textContent="Final score: "+correct+" / "+n;
 $("msg").textContent=p>=90?"Outstanding work!":p>=70?"Well done!":p>=50?"Good effort — keep practising!":"Keep studying — you can do it!";
 show("s-end");
}
$("go").onclick=start;$("re").onclick=start;$("next").onclick=next;
</script></body></html>
