<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Law Quiz 10 · Center JUST</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--txt:#F4F7FC;--mut:#A9B6D3;--green:#3FA66B;--red:#DE4040;--card:#F3EBD6;--ink:#1A2236}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 100% 0%,rgba(36,84,190,.38),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(214,177,88,.08),transparent 50%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%),var(--navy)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.55);background:rgba(6,14,36,.6);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;flex:none}
.brand .n{font-family:Georgia,serif;font-size:1.15rem;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.tag{font-size:.72rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:4px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8923a,var(--gold));transition:width .4s}
main{max-width:760px;margin:0 auto;padding:26px 16px 40px;min-height:calc(100vh - 130px)}
.panel{background:rgba(14,26,58,.72);border:1px solid rgba(214,177,88,.45);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:28px 22px}
.center{text-align:center}
.hero{width:170px;height:170px;border-radius:50%;box-shadow:0 0 0 3px rgba(214,177,88,.6),0 0 40px rgba(214,177,88,.25);margin:0 auto 10px;display:block}
.wm{font-family:Georgia,serif;font-size:1.5rem;letter-spacing:.14em;color:var(--gold);margin-bottom:18px}
h1{font-family:Georgia,serif;font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.2}
.rule{width:80px;height:2px;background:var(--gold);margin:16px auto}
.sub{color:var(--mut);font-size:1.05rem;max-width:480px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 26px}
.chip{border:1px solid rgba(214,177,88,.55);border-radius:999px;padding:7px 16px;font-size:.92rem;color:var(--txt);background:rgba(214,177,88,.08)}
.chip b{color:var(--gold)}
.btn{font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer;border-radius:12px;padding:14px 30px;min-height:50px;border:1px solid var(--gold);transition:transform .15s,box-shadow .15s,background .15s}
.btn.gold{background:linear-gradient(180deg,#e4c776,var(--gold));color:#1a1405;box-shadow:0 6px 20px rgba(214,177,88,.28)}
.btn.gold:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.4)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(214,177,88,.12)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--mut);margin-bottom:14px;letter-spacing:.04em}
.meta b{color:var(--gold)}
.qcard{background:var(--card);color:var(--ink);border-radius:16px;padding:26px 22px;border:1px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 0 0 4px rgba(214,177,88,.18);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kind{display:inline-block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#8a6a1f;border:1px solid #b8923a;border-radius:999px;padding:2px 12px;margin-bottom:12px}
.qt{font-family:Georgia,serif;font-size:clamp(1.15rem,4.2vw,1.45rem);line-height:1.45;margin-bottom:20px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:1.02rem;color:var(--ink);background:#fffaf0;border:2px solid #d9c9a0;border-radius:12px;padding:13px 15px;min-height:56px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s,opacity .2s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold);background:#fff}
.opt .L{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#0d1b40;color:var(--gold);font-size:.95rem}
.opt:disabled{cursor:default}
.opt.ok{background:#2f6fd0;border-color:#1f56a8;color:#fff}
.opt.ok .L{background:#fff;color:#1f56a8}
.opt.bad{background:var(--red);border-color:#b02a2a;color:#fff;animation:shake .35s}
.opt.bad .L{background:#fff;color:var(--red)}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;border-left:5px solid;animation:in .3s ease}
.fb.ok{background:rgba(47,111,208,.12);border-color:#2f6fd0}
.fb.bad{background:rgba(222,64,64,.1);border-color:var(--red)}
.fb h3{font-family:Georgia,serif;font-size:1.1rem;margin-bottom:4px}
.fb.ok h3{color:#1f56a8}.fb.bad h3{color:#b02a2a}
.fb p{font-size:.98rem}
.nx{display:flex;justify-content:flex-end;margin-top:16px}
.pct{font-family:Georgia,serif;font-size:clamp(3.4rem,16vw,5.5rem);color:var(--gold);line-height:1}
.msg{color:var(--mut);margin:8px 0 22px}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:26px}
.rev h2{font-family:Georgia,serif;color:var(--gold);font-size:1.2rem;margin:10px 0 12px}
.ri{background:rgba(255,255,255,.04);border-left:4px solid;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:.96rem}
.ri.ok{border-color:#2f6fd0}.ri.bad{border-color:var(--red)}
.ri .q{margin-bottom:6px}
.ri .a{color:var(--mut);font-size:.9rem}
.ri .a b{color:var(--txt)}
footer{text-align:center;color:var(--mut);font-size:.8rem;letter-spacing:.12em;padding:0 16px 22px}
footer span{color:var(--gold)}
.hide{display:none!important}
@media(max-width:560px){.tag{font-size:.62rem;letter-spacing:.14em}.brand .n{font-size:1rem}header{padding:10px 12px}.panel{padding:24px 16px}.qcard{padding:20px 16px}}
</style>
</head>

var BANK = [{"t": "tf", "q": "The three essential elements of a state are territory, population, and sovereign authority.", "a": true, "e": "A state is defined by its territory, its population, and a sovereign authority."}, {"t": "tf", "q": "A state's territory consists exclusively of its land and maritime areas.", "a": false, "e": "Territory is not limited to land and maritime areas; it covers more than these two."}, {"t": "tf", "q": "Natural boundaries may include rivers, mountains, seas, and deserts.", "a": true, "e": "Rivers, mountains, seas, and deserts are all examples of natural boundaries."}, {"t": "tf", "q": "Artificial boundaries are always established through international treaties and cannot be created by physical markers.", "a": false, "e": "Artificial boundaries can be marked physically, for example by a line of cement pillars."}, {"t": "tf", "q": "The principle of uti possidetis requires newly independent states to respect the administrative boundaries inherited from the colonial period.", "a": true, "e": "Uti possidetis preserves inherited administrative boundaries to prevent territorial conflicts."}, {"t": "tf", "q": "The principle of finality and stability of frontiers permits states to change their international boundaries unilaterally whenever necessary.", "a": false, "e": "Under this principle, boundaries may be changed only by the free consent of the states concerned."}, {"t": "tf", "q": "Military occupation of foreign territory automatically grants the occupying state legal sovereignty over that territory.", "a": false, "e": "De facto control (the factual situation) is different from de jure sovereignty (the legal position)."}, {"t": "tf", "q": "The subsequent conduct of a state may be considered in boundary disputes if it clearly reflects the state's intention and is carried out by authorized representatives.", "a": true, "e": "Subsequent conduct counts when it clearly reveals the state's intention and comes from authorized representatives."}, {"t": "tf", "q": "A state's silence regarding an encroachment on its territory can never affect its legal rights.", "a": false, "e": "Silence can affect a state's legal rights; estoppel, for instance, prevents a state from contradicting its earlier conduct."}, {"t": "tf", "q": "The Thalweg Principle determines the boundary of a navigable river by reference to the middle of its principal navigable channel.", "a": true, "e": "The Thalweg is the middle of the principal navigable channel, ensuring both states have access to it."}, {"t": "tf", "q": "An international river must physically cross the territories of at least three states.", "a": false, "e": "The three-state requirement does not exist; a river shared by two states can be international."}, {"t": "tf", "q": "Under customary international law, foreign vessels generally enjoy an automatic right of innocent passage through international rivers.", "a": false, "e": "Navigation in international rivers is generally regulated by agreements between the states concerned."}, {"t": "tf", "q": "The Harmon Doctrine allows a state to exploit water resources within its territory regardless of the harm caused to other states.", "a": true, "e": "The Harmon Doctrine asserts unrestricted control over water within a state's territory, regardless of harm to others."}, {"t": "tf", "q": "The principle of equitable and reasonable utilization requires states to consider geographical, ecological, social, and economic factors when using international watercourses.", "a": true, "e": "Equitable and reasonable utilization requires weighing geographical, ecological, social, and economic factors."}, {"t": "tf", "q": "A state may incur international responsibility when activities within its jurisdiction cause transboundary pollution in an international river in breach of its obligations.", "a": true, "e": "Transboundary pollution in breach of a state's obligations can engage that state's international responsibility."}, {"t": "mcq", "q": "Which of the following is NOT one of the three constitutive elements of a state?", "o": ["Territory", "Population", "Sovereign authority", "International recognition"], "a": 3, "e": "The three constitutive elements are territory, population, and sovereign authority; international recognition is not one of them."}, {"t": "mcq", "q": "What is the primary legal function of an international boundary?", "o": ["To regulate international trade", "To determine where the sovereignty of one state ends and another begins", "To establish diplomatic relations", "To control the population of neighboring states"], "a": 1, "e": "A boundary marks where one state's sovereignty ends and another's begins."}, {"t": "mcq", "q": "Which of the following is an example of an artificial boundary?", "o": ["A mountain range", "A desert", "A line marked by cement pillars", "A river"], "a": 2, "e": "Mountains, deserts, and rivers are natural boundaries; a line marked by cement pillars is man-made."}, {"t": "mcq", "q": "What is the main purpose of the principle of uti possidetis?", "o": ["To encourage territorial expansion", "To allow states to redraw inherited borders", "To prevent territorial conflicts by preserving inherited boundaries", "To abolish colonial administrative boundaries"], "a": 2, "e": "Uti possidetis preserves inherited boundaries so as to prevent territorial conflicts."}, {"t": "mcq", "q": "According to the principle of finality and stability of frontiers, international boundaries may be changed through:", "o": ["Unilateral decisions by one state", "Military occupation", "The free consent of the states concerned", "Economic pressure imposed by neighboring states"], "a": 2, "e": "Boundaries may be changed only by the free consent of the states concerned."}, {"t": "mcq", "q": "Which statement correctly distinguishes de facto control from de jure sovereignty?", "o": ["De facto control always establishes legal sovereignty.", "De jure sovereignty depends exclusively on military strength.", "De facto control refers to the factual situation, while de jure sovereignty refers to the legal position.", "Both concepts necessarily mean the same thing."], "a": 2, "e": "De facto is the factual situation; de jure is the legal position."}, {"t": "mcq", "q": "Which of the following conditions is necessary for subsequent state practice to be considered in a boundary dispute?", "o": ["The conduct must be performed by private individuals.", "The conduct must clearly reveal the state's intention regarding the relevant issue.", "The conduct must involve military action.", "The conduct must contradict previous international agreements."], "a": 1, "e": "Subsequent conduct must clearly reveal the state's intention on the relevant issue."}, {"t": "mcq", "q": "In the Taba Arbitration, which principle was relevant to preventing a state from contradicting its previous conduct?", "o": ["Absolute sovereignty", "Innocent passage", "Estoppel", "Equitable utilization"], "a": 2, "e": "Estoppel prevents a state from contradicting its previous conduct."}, {"t": "mcq", "q": "In an international river that is not navigable, the boundary is typically determined by:", "o": ["The deepest navigable channel", "The middle of the river (medium filum aquae)", "The bank belonging to the larger state", "The historical fishing zones"], "a": 1, "e": "For non-navigable rivers, the boundary is the middle of the river (medium filum aquae)."}, {"t": "mcq", "q": "What is the primary function of the Thalweg Principle?", "o": ["To divide river water equally by volume", "To grant one state exclusive control over navigation", "To ensure both states have access to the principal navigable channel", "To prohibit commercial navigation"], "a": 2, "e": "The Thalweg Principle ensures both states have access to the principal navigable channel."}, {"t": "mcq", "q": "Which statement best describes navigation in international rivers under customary international law?", "o": ["All foreign vessels have an unrestricted right of navigation.", "Navigation is generally regulated by agreements between the states concerned.", "International rivers are governed by the same navigation rules as the high seas.", "Warships of non-riparian states have an automatic right of passage."], "a": 1, "e": "Navigation is generally regulated by agreements between the states concerned."}, {"t": "mcq", "q": "Which international agreement governs the special navigation regime of the Suez Canal?", "o": ["The 1969 Vienna Convention", "The 1997 Watercourses Convention", "The Constantinople Convention", "The Charter of the African Union"], "a": 2, "e": "The Suez Canal's special navigation regime is governed by the Constantinople Convention."}, {"t": "mcq", "q": "State A constructs a hydroelectric dam on an international river without considering serious damage to downstream State B. Which legal approach most directly rejects State A's claim of unrestricted control over the water?", "o": ["The Harmon Doctrine", "The principle of limited sovereignty", "The principle of territorial conquest", "The principle of absolute freedom of navigation"], "a": 1, "e": "The principle of limited sovereignty rejects unrestricted control; the Harmon Doctrine is the opposite view."}, {"t": "mcq", "q": "Under the 1997 Convention on the Law of Non-Navigational Uses of International Watercourses, which combination of obligations is correct?", "o": ["Absolute sovereignty, unrestricted exploitation, and unilateral decision-making", "Equitable utilization, prevention of significant harm, and cooperation through information exchange", "Exclusive downstream control, unrestricted navigation, and military enforcement", "Territorial expansion, compulsory water ownership, and prohibition of negotiations"], "a": 1, "e": "The Convention combines equitable utilization, prevention of significant harm, and cooperation through information exchange."}, {"t": "mcq", "q": "State A introduces a non-native aquatic species into a shared river. The species spreads into State B and seriously disrupts the river's ecosystem. Which obligation is most directly relevant?", "o": ["The obligation to preserve ecosystem integrity", "The principle of finality of frontiers", "The doctrine of uti possidetis", "The principle of innocent passage"], "a": 0, "e": "Seriously disrupting a shared river's ecosystem engages the obligation to preserve ecosystem integrity."}];

function begin(src){

function pick(i){
  if(answered)return;answered=true;var q=run[idx],ok=i===q.c;

  var n=run.length,pc=Math.round(score/n*100),wrong=log.filter(function(l){return !l.ok});
  var msg=pc>=90?"Outstanding work!":pc>=70?"Well done!":pc>=50?"Good effort, keep practising.":"Keep studying and try again.";
  var h='<section class="panel center"><div class="wm" style="margin-bottom:6px">Center JUST</div><p class="sub">'+esc(TITLE)+'</p><div class="rule"></div>'+
   '<div class="pct">'+pc+'%</div><p style="font-size:1.25rem;margin-top:8px"><b>'+score+' / '+n+'</b> correct</p><p class="msg">'+msg+'</p><div class="acts">'+
   '<button class="btn gold" id="rs">Restart the Quiz</button>'+
   (wrong.length?'<button class="btn ghost" id="rw">Retry wrong answers ('+wrong.length+')</button>':'')+
   '</div></section><section class="rev" style="margin-top:22px"><h2>Review</h2>';
  log.forEach(function(l,k){
    var q=l.q,sel=q.t==="tf"?q.o[l.sel]:LET[l.sel]+". "+q.o[l.sel],c=q.t==="tf"?q.o[q.c]:LET[q.c]+". "+q.o[q.c];
    h+='<div class="ri '+(l.ok?"ok":"bad")+'"><div class="q"><b>'+(k+1)+'.</b> '+esc(q.q)+'</div><div class="a">Your answer: <b>'+esc(sel)+'</b>'+(l.ok?"":' &nbsp;·&nbsp; Correct answer: <b>'+esc(c)+'</b>')+'</div></div>';
  });
  h+='</section>';
  app.innerHTML=h;prog.style.width="100%";window.scrollTo(0,0);
  document.getElementById("rs").onclick=function(){begin(BANK)};
  var rw=document.getElementById("rw");
  if(rw)rw.onclick=function(){
    var ws=wrong.map(function(l){return l.q});
    // rebuild from bank by question text
    var src=BANK.filter(function(b){return ws.some(function(w){return w.q===b.q})});
    begin(src);
  };
}
document.addEventListener("keydown",function(e){
  var nx=document.getElementById("next");
  if(e.key==="Enter"){if(nx){nx.click()}else{var g=document.getElementById("go")||document.getElementById("rs");if(g&&document.activeElement===document.body)g.click()}return}
  if(!answered&&run.length&&document.getElementById("opts")){
    var k=e.key.toLowerCase(),q=run[idx],i=-1;
    if(q.t==="tf"){if(k==="t"||k==="a")i=0;else if(k==="f"||k==="b")i=1}
    else i="abcd".indexOf(k);
    if(i>=0&&i<q.o.length)pick(i);
  }
});
start();
</script>
