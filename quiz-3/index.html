<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Int. Law Quiz 3 | Center JUST</title>
<style>
:root{--navy:#0b1b3a;--navy2:#13306b;--gold:#d4a73a;--gold2:#f3d27a;--parch:#fbf5e4;--ink:#1d2a44;--blue:#1f5fd6;--blue2:#4a8bff;--red:#d62839;--red2:#ff5468;--green:#18a06a;--amber:#e08a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:linear-gradient(135deg,#081530,#0f2a5e 45%,#2a1a5e);background-attachment:fixed;display:flex;justify-content:center;padding:16px;position:relative;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
.b1{width:320px;height:320px;background:#ff5468;top:-80px;left:-90px}
.b2{width:360px;height:360px;background:#2d8cff;bottom:-110px;right:-100px;animation-delay:-4s}
.b3{width:260px;height:260px;background:#f3d27a;top:45%;left:60%;animation-delay:-8s}
.b4{width:240px;height:240px;background:#18a06a;top:55%;left:-80px;animation-delay:-2s}
@keyframes float{to{transform:translate(40px,30px) scale(1.15)}}
.app{position:relative;z-index:1;width:100%;max-width:760px;margin:auto}
.screen{display:none;animation:pop .45s ease}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,#fffaf0,var(--parch));border:3px solid var(--gold);border-radius:22px;padding:26px 22px;box-shadow:0 0 0 6px rgba(212,167,58,.25),0 18px 45px rgba(0,0,0,.45)}
.center{text-align:center}
.logo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:bob 3.5s ease-in-out infinite}
.logo.sm{width:62px;height:62px;animation:none}
@keyframes bob{50%{transform:translateY(-8px)}}
.brand{font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:var(--navy2);margin:6px 0 14px;font-size:1.05rem}
h1{margin:6px 0;font-size:clamp(1.9rem,6vw,2.7rem);background:linear-gradient(90deg,var(--blue),#8a2be2,var(--red),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:1.05rem;color:#4a5878;margin:6px 0 18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}
.chip{padding:8px 14px;border-radius:999px;color:#fff;font-weight:bold;font-size:.95rem;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.c1{background:linear-gradient(135deg,#6a3df0,#9b6dff)}.c2{background:linear-gradient(135deg,var(--blue),var(--blue2))}.c3{background:linear-gradient(135deg,var(--red),var(--red2))}
.btn{font-family:inherit;font-size:1.15rem;font-weight:bold;border:0;border-radius:14px;padding:15px 28px;cursor:pointer;color:#fff;min-height:54px;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.main{background:linear-gradient(135deg,var(--amber),#f5b82e);color:#2a1a00}
.btn.next{background:linear-gradient(135deg,#6a3df0,var(--blue));width:100%;margin-top:16px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .meta{flex:1}
.qn{font-weight:bold;color:var(--navy2)}
.score{font-weight:bold;color:#0b6b46}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:11px;background:#e5dcc0;border-radius:99px;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#8a2be2,var(--red),var(--amber));transition:width .4s}
.tag{display:inline-block;font-size:.8rem;font-weight:bold;letter-spacing:1px;color:#fff;padding:4px 11px;border-radius:99px;margin:14px 0 8px;background:linear-gradient(135deg,#6a3df0,#9b6dff)}
.q{font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.45;margin:6px 0 18px;font-weight:bold}
.opts{display:grid;gap:12px}
.tfgrid{grid-template-columns:1fr 1fr}
.opt{position:relative;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:13px 16px;border-radius:14px;border:2px solid #d9cba0;background:#fff;color:var(--ink);font-size:1.05rem;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .2s;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.opt .let{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:bold}
.opt:nth-child(1) .let{background:#6a3df0}.opt:nth-child(2) .let{background:#e08a00}.opt:nth-child(3) .let{background:#18a06a}.opt:nth-child(4) .let{background:#d6409f}
.opt.tf{justify-content:center;font-size:1.35rem;font-weight:bold;color:#fff;border:0;min-height:72px}
.opt.tf.t{background:linear-gradient(135deg,var(--blue),var(--blue2))}
.opt.tf.f{background:linear-gradient(135deg,var(--red),var(--red2))}
.opt:disabled{cursor:default}
.opt.dim{opacity:.4}
.opt .mark{margin-left:auto;font-size:1.3rem;font-weight:bold}
.opt.correct{outline:4px solid #2fd08a;outline-offset:2px;transform:scale(1.02);animation:glow 1s ease}
.opt.mc.correct{background:linear-gradient(135deg,#12915f,#2fd08a);color:#fff;border-color:#12915f}
.opt.mc.correct .let{background:#fff;color:#12915f}
.opt.tf.correct .mark{background:#fff;color:#12915f;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;margin-left:12px;font-size:1.2rem}
.opt.mc.wrong{background:#cfd5e2;color:#4b5570;border-color:#8892a8;text-decoration:line-through}
.opt.tf.wrong{filter:grayscale(.55);opacity:.7}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(47,208,138,.9)}100%{box-shadow:0 0 0 22px rgba(47,208,138,0)}}
.fb{display:none;margin-top:16px;padding:14px 16px;border-radius:14px;border-left:8px solid;animation:pop .35s}
.fb.show{display:block}
.fb.ok{background:#e4f8ee;border-color:var(--green)}
.fb.no{background:#fff0d6;border-color:var(--amber)}
.fb b{display:block;font-size:1.15rem;margin-bottom:4px}
.fb p{margin:0;line-height:1.5}
.big{font-size:3.6rem;font-weight:bold;margin:6px 0;background:linear-gradient(90deg,var(--blue),var(--red),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.msg{font-size:1.2rem;margin:4px 0 20px}
.confetti{position:fixed;top:-30px;font-size:1.6rem;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
@media(max-width:480px){.card{padding:20px 14px}.tfgrid{grid-template-columns:1fr 1fr}.logo{width:120px;height:120px}}
</style>
</head>

<script>
var QUESTIONS = [{"type": "tf", "q": "A treaty must be embodied in a single instrument to be considered valid under international law.", "answer": false, "exp": "A treaty may be contained in one instrument or in two or more related instruments. A single document is not required."}, {"type": "tf", "q": "The 1969 Vienna Convention on the Law of Treaties governs treaties that include international organizations.", "answer": false, "exp": "The 1969 Vienna Convention governs treaties concluded between states. Treaties involving international organizations fall under the 1986 Vienna Convention."}, {"type": "tf", "q": "A state is bound by a treaty even if it has not freely consented to its terms.", "answer": false, "exp": "A treaty is based on the free consent of the parties. A state cannot be bound by terms it has not freely consented to."}, {"type": "tf", "q": "A treaty is distinct from a commercial contract because it is governed by international law, not domestic law.", "answer": true, "exp": "What sets a treaty apart from an ordinary contract is that it is governed by international law rather than by domestic law."}, {"type": "tf", "q": "Oral agreements can be legally binding under international law, even though the Vienna Convention only applies to written treaties.", "answer": true, "exp": "Oral agreements may still be legally binding in international law. The Vienna Convention simply applies only to written treaties."}, {"type": "tf", "q": "The name given to an international agreement, such as \"protocol,\" \"convention,\" or \"declaration,\" is crucial in determining its legal status as a treaty.", "answer": false, "exp": "The name is not decisive. Whatever it is called, an agreement is a treaty if it meets the required elements."}, {"type": "tf", "q": "A treaty concluded between Germany and France is an example of a multilateral treaty.", "answer": false, "exp": "A treaty between two states is a bilateral treaty. Multilateral treaties involve three or more parties."}, {"type": "tf", "q": "A Traité-Contrat (Contractual Treaty) is legislative in nature and establishes general rules for the international community.", "answer": false, "exp": "That describes a law-making treaty (Traité-Loi). A contractual treaty settles a specific, reciprocal transaction between parties."}, {"type": "tf", "q": "The UN Convention on the Law of the Sea is considered an example of a law-making treaty (Traité-Loi).", "answer": true, "exp": "It establishes general rules for the international community, which is the defining feature of a law-making treaty."}, {"type": "tf", "q": "The ability of a party to enter into a legally binding agreement is known as \"capacity.\"", "answer": true, "exp": "Capacity is the ability of a party to conclude a legally binding treaty."}, {"type": "tf", "q": "Under international law, only states with a permanent seat on the UN Security Council have the inherent capacity to conclude any treaty.", "answer": false, "exp": "Every sovereign state has the inherent capacity to conclude treaties. It does not depend on a permanent Security Council seat."}, {"type": "tf", "q": "The capacity of an international organization to conclude treaties is unrestricted and equal to that of a sovereign state.", "answer": false, "exp": "An organization's capacity is limited by its founding documents and functions, unlike the full capacity of a sovereign state."}, {"type": "tf", "q": "The \"Principle of Speciality\" dictates that an international organization's capacity to make treaties is limited by its founding documents and functions.", "answer": true, "exp": "Under the Principle of Speciality, an organization may conclude only the treaties permitted by its founding documents and functions."}, {"type": "tf", "q": "Entering into a treaty is considered an abandonment and surrender of a state's sovereignty.", "answer": false, "exp": "Committing to a treaty is an exercise and manifestation of sovereignty, not a surrender of it."}, {"type": "tf", "q": "\"Full powers\" is a formal document from a state authority designating a person to represent the state in treaty negotiations and conclusion.", "answer": true, "exp": "Full powers is the formal document issued by a competent state authority designating a person to represent the state in the treaty-making process."}, {"type": "tf", "q": "A Minister for Foreign Affairs must always produce a \"full powers\" document before performing any act related to the conclusion of a treaty.", "answer": false, "exp": "A Minister for Foreign Affairs represents the state by virtue of the function held and does not need to produce full powers."}, {"type": "tf", "q": "The head of a diplomatic mission (e.g., an ambassador) is authorized to adopt the text of any multilateral treaty at an international conference.", "answer": false, "exp": "An ambassador is authorized to adopt a treaty text only between the sending state and the host state, not for any multilateral treaty."}, {"type": "tf", "q": "An act relating to the conclusion of a treaty performed by an unauthorized person has no legal effect, even if the state later confirms it.", "answer": false, "exp": "Such an act has no legal effect unless the state subsequently confirms it. Confirmation can give it effect."}, {"type": "tf", "q": "Subsequent confirmation (ratification) of an unauthorized act is a form of retroactive approval.", "answer": true, "exp": "By confirming an act performed without authorization, the state approves it retroactively."}, {"type": "tf", "q": "A law-making treaty (Traité-Loi) primarily aims to settle a specific, reciprocal transaction, such as a trade agreement to export rice.", "answer": false, "exp": "That describes a contractual treaty (Traité-Contrat). A law-making treaty lays down general rules for the international community."}, {"type": "mc", "q": "What is the primary legal framework that governs treaties concluded between states?", "options": ["The 1986 Vienna Convention", "The UN Convention on the Law of the Sea", "The 1969 Vienna Convention on the Law of Treaties", "The Geneva Conventions on humanitarian law"], "answer": 2, "exp": "The 1969 Vienna Convention on the Law of Treaties governs treaties between states. The 1986 Convention covers treaties involving international organizations."}, {"type": "mc", "q": "Which of the following is NOT a key element required for an agreement to be considered an international treaty?", "options": ["It must be governed by international law.", "It must be based on the free consent of the parties.", "It must be concluded between subjects of international law.", "It must be publicly announced in the national media of all parties."], "answer": 3, "exp": "A treaty must be governed by international law, rest on free consent, and be concluded between subjects of international law. Public announcement in national media is not required."}, {"type": "mc", "q": "A specific trade agreement signed between Brazil and Argentina to regulate the export of beef would be best classified as:", "options": ["A multilateral, law-making treaty (Traité-Loi)", "A multilateral, contractual treaty (Traité-Contrat)", "A bilateral, contractual treaty (Traité-Contrat)", "A bilateral, law-making treaty (Traité-Loi)"], "answer": 2, "exp": "Two states make it bilateral, and it settles a specific reciprocal transaction, which makes it a contractual treaty."}, {"type": "mc", "q": "The \"Principle of Speciality\" applies to:", "options": ["Sovereign states, limiting their treaty-making power to specific subjects.", "International organizations, limiting their capacity to conclude treaties to what is allowed by their functions and founding documents.", "High-level officials like Heads of State, giving them special authority.", "Oral treaties, specifying the conditions under which they are valid."], "answer": 1, "exp": "The Principle of Speciality limits an international organization's treaty-making capacity to what its functions and founding documents allow."}, {"type": "mc", "q": "Which of the following individuals would be considered to represent their state by virtue of their function and would NOT need to produce a \"full powers\" document to perform any act related to concluding a treaty?", "options": ["An ambassador accredited to the host country.", "A representative accredited to a UN conference.", "A legal expert from the Ministry of Justice.", "The Minister for Foreign Affairs."], "answer": 3, "exp": "Heads of State, Heads of Government and Ministers for Foreign Affairs represent the state by virtue of their function. Ambassadors and conference representatives are authorized only for limited acts."}, {"type": "mc", "q": "A treaty that establishes general rules and norms for the international community, such as the Vienna Convention on the Law of Treaties itself, is known as a:", "options": ["Traité-Contrat", "Traité-Loi", "Bilateral Treaty", "Contractual Treaty"], "answer": 1, "exp": "A Traité-Loi (law-making treaty) establishes general rules for the international community."}, {"type": "mc", "q": "A state committing to the obligations within a treaty is considered:", "options": ["A surrender of the state's sovereignty.", "An act that undermines the state's legal standing.", "An exercise and manifestation of the state's sovereignty.", "A temporary measure that can be revoked at any time without consequence."], "answer": 2, "exp": "Committing to a treaty is an exercise and manifestation of sovereignty, not a loss of it."}, {"type": "mc", "q": "If a state delegate, who was only authorized to negotiate, signs a treaty without authorization, what is the legal status of that signature?", "options": ["It is automatically legally binding on the state.", "It has no legal effect unless the state provides subsequent confirmation (ratification).", "It is considered a criminal act by the delegate.", "It is valid only if the other parties to the treaty agree to it."], "answer": 1, "exp": "An act by an unauthorized person has no legal effect unless the state later confirms it."}, {"type": "mc", "q": "What is the fundamental difference in the \"capacity\" to conclude treaties between a sovereign state and an international organization?", "options": ["There is no difference; their capacity is identical.", "States have full and unrestricted capacity, while an organization's capacity is limited.", "International organizations have full capacity, while a state's capacity is limited.", "States can only sign bilateral treaties, whereas organizations can sign multilateral ones."], "answer": 1, "exp": "A sovereign state has full capacity to conclude treaties, while an organization's capacity is limited by its founding documents and functions."}, {"type": "mc", "q": "What is the formal document issued by a state's competent authority that designates a person to represent it in the treaty-making process called?", "options": ["A Diplomatic Note", "A Ratification Instrument", "A Letter of Intent", "Full Powers"], "answer": 3, "exp": "Full powers is the formal document designating a person to represent the state in negotiating and concluding a treaty."}];
var order=[],idx=0,correct=0,answered=false;
var $=function(id){return document.getElementById(id)};
function show(id){["intro","game","result"].forEach(function(s){$(s).classList.toggle("active",s===id)});window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var nTF=QUESTIONS.filter(function(q){return q.type==="tf"}).length,nMC=QUESTIONS.length-nTF;
$("cTotal").textContent=QUESTIONS.length+" Questions";
$("cTF").textContent=nTF+" True / False";
$("cMC").textContent=nMC+" Multiple Choice";
function start(){order=shuffle(QUESTIONS);idx=0;correct=0;show("game");render()}
function render(){
  var q=order[idx];answered=false;
  $("qn").textContent="Question "+(idx+1)+" of "+order.length;
  $("sc").textContent="✔ Correct: "+correct;
  $("fill").style.width=(idx/order.length*100)+"%";
  $("tag").textContent=q.type==="tf"?"TRUE OR FALSE":"MULTIPLE CHOICE";
  $("qtext").textContent=q.q;
  $("fb").className="fb";$("nextBtn").style.display="none";
  var box=$("opts");box.innerHTML="";
  box.className="opts"+(q.type==="tf"?" tfgrid":"");
  if(q.type==="tf"){
    [[true,"True","t"],[false,"False","f"]].forEach(function(o){
      var b=document.createElement("button");b.className="opt tf "+o[2];b.setAttribute("data-v",o[0]);
      b.textContent=o[1];b.onclick=function(){pick(o[0],b)};box.appendChild(b)});
  }else{
    q.options.forEach(function(t,i){
      var b=document.createElement("button");b.className="opt mc";
      var l=document.createElement("span");l.className="let";l.textContent="ABCD".charAt(i);
      var s=document.createElement("span");s.textContent=t;
      b.appendChild(l);b.appendChild(s);b.onclick=function(){pick(i,b)};box.appendChild(b)});
  }
}
function pick(val,btn){
  if(answered)return;answered=true;
  var q=order[idx],ok=(val===q.answer);
  if(ok)correct++;
  var btns=$("opts").children;
  for(var i=0;i<btns.length;i++){
    var b=btns[i];b.disabled=true;
    var v=q.type==="tf"?(b.getAttribute("data-v")==="true"):i;
    var mark=document.createElement("span");mark.className="mark";
    if(v===q.answer){b.classList.add("correct");mark.textContent="✓";b.appendChild(mark)}
    else if(b===btn){b.classList.add("wrong");mark.textContent="✗";b.appendChild(mark)}
    else b.classList.add("dim");
  }
  $("sc").textContent="✔ Correct: "+correct;
  $("fb").className="fb show "+(ok?"ok":"no");
  $("fbT").textContent=ok?"🎉 Correct!":"❌ Incorrect";
  $("fbP").textContent=q.exp;
  $("fill").style.width=((idx+1)/order.length*100)+"%";
  var n=$("nextBtn");n.style.display="block";
  n.textContent=idx===order.length-1?"See my score ▶":"Next question ▶";
}
function next(){idx++;if(idx>=order.length)finish();else render()}
function finish(){
  show("result");
  $("final").textContent=correct+" / "+order.length;
  var p=correct/order.length;
  $("rmsg").textContent=p>=.9?"🏆 Outstanding work!":p>=.75?"🌟 Great job!":p>=.5?"👍 Good effort, keep practising!":"📚 Keep studying and try again!";
  if(p>=.5)confetti();
}
function confetti(){
  var e=["🎉","⭐","✨","🎊","💙","❤️","💛"];
  for(var i=0;i<40;i++){var d=document.createElement("div");d.className="confetti";d.textContent=e[i%e.length];
    d.style.left=Math.random()*100+"vw";d.style.animationDuration=(2.5+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*.8)+"s";
    document.body.appendChild(d);setTimeout(function(x){x.remove()},6500,d)}
}
$("startBtn").onclick=start;$("nextBtn").onclick=next;$("restartBtn").onclick=start;
</script>
</body>
</html>
