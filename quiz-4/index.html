<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Int. Law Quiz 4 | Center JUST</title>
<style>
:root{--navy:#0b1426;--navy2:#111d36;--gold:#c9a24b;--gold2:#e6c878;--parch:#f6efdc;--parch2:#efe5c9;--ink:#1c2233;--blue:#1f5fd1;--blueBg:#dce8ff;--red:#c62f2f;--redBg:#fde0de}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:radial-gradient(ellipse at top,#16254a 0%,var(--navy) 55%,#060b16 100%) fixed;display:flex;justify-content:center;padding:18px 14px 40px}
.app{width:100%;max-width:760px}
.screen{display:none;animation:rise .5s ease both}
.screen.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.brand{text-align:center;margin-bottom:16px}
.brand img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.brand .name{color:var(--gold2);font-size:1.25rem;letter-spacing:.28em;text-transform:uppercase;margin-top:6px;font-weight:bold}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));border:2px solid var(--gold);border-radius:18px;padding:26px 22px;box-shadow:0 0 0 5px rgba(201,162,75,.15),0 18px 40px rgba(0,0,0,.55)}
.center{text-align:center}
h1{font-size:clamp(1.5rem,5vw,2.1rem);color:var(--navy);line-height:1.25;margin-bottom:8px}
.sub{color:#4a4f63;font-size:1.05rem;margin-bottom:18px;line-height:1.5}
.rule{height:2px;width:90px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 24px}
.chip{background:var(--navy);color:var(--gold2);padding:9px 16px;border-radius:30px;font-size:.95rem;border:1px solid var(--gold)}
.chip b{color:#fff}
.btn{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:15px 30px;font-size:1.1rem;font-weight:bold;color:var(--navy);background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 5px 0 #8f6f27,0 10px 20px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s;min-height:52px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f6f27}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--gold2);font-size:1rem;flex-wrap:wrap}
.topbar .mini{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.topbar .mini img{width:38px;height:38px;object-fit:contain}
.score{background:var(--navy2);border:1px solid var(--gold);border-radius:20px;padding:6px 14px}
.bar{height:10px;background:#1b2845;border-radius:10px;overflow:hidden;margin-bottom:16px;border:1px solid rgba(201,162,75,.4)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease;border-radius:10px}
.qtype{display:inline-block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;background:var(--navy);color:var(--gold2);padding:4px 12px;border-radius:20px;margin-bottom:12px}
.qtext{font-size:clamp(1.15rem,3.8vw,1.45rem);line-height:1.45;color:var(--navy);margin-bottom:20px;font-weight:bold}
.opts{display:grid;gap:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{font-family:inherit;text-align:left;display:flex;gap:12px;align-items:center;background:#fffaf0;border:2px solid #d8c694;border-radius:12px;padding:14px 16px;font-size:1.05rem;color:var(--ink);cursor:pointer;min-height:56px;line-height:1.4;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold);background:#fff}
.opts.tf .opt{justify-content:center;text-align:center;font-weight:bold;font-size:1.2rem}
.opts.tf .opt:hover:not(:disabled){transform:translateY(-3px)}
.opt .l{flex:0 0 32px;height:32px;border-radius:50%;background:var(--navy);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.95rem}
.opt:disabled{cursor:default}
.opt.correct{background:var(--blueBg);border-color:var(--blue);color:#0d2f6e}
.opt.correct .l{background:var(--blue);color:#fff}
.opt.wrong{background:var(--redBg);border-color:var(--red);color:#7d1515;animation:shake .4s}
.opt.wrong .l{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;display:none;line-height:1.55;animation:rise .35s ease both}
.fb.show{display:block}
.fb.ok{background:var(--blueBg);border-left:6px solid var(--blue);color:#0d2f6e}
.fb.no{background:var(--redBg);border-left:6px solid var(--red);color:#7d1515}
.fb strong{display:block;font-size:1.1rem;margin-bottom:4px}
.next{margin-top:18px;text-align:right;display:none}
.next.show{display:block}
.final{font-size:clamp(2.6rem,12vw,4.2rem);color:var(--navy);font-weight:bold;margin:6px 0}
.pct{color:#4a4f63;font-size:1.15rem}
.msg{margin:14px 0 22px;font-size:1.15rem;color:var(--navy)}
.resbrand img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.resbrand div{color:var(--gold);font-weight:bold;letter-spacing:.25em;text-transform:uppercase;margin-top:4px;font-size:1rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:520px){.card{padding:20px 15px}.opts.tf{grid-template-columns:1fr}.next{text-align:center}.next .btn{width:100%}.brand img{width:110px;height:110px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">

<section id="intro" class="screen active">
  <div class="brand"><img data-logo="1" alt="Center JUST logo"><div class="name">Center JUST</div></div>
  <div class="card center">
    <h1 id="quizTitle"></h1>
    <div class="rule"></div>
    <p class="sub">Welcome to Center JUST, please answer the following questions.</p>
    <div class="chips" id="chips"></div>
    <button class="btn" id="startBtn">Start Quiz</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="mini"><img data-logo="1" alt="Center JUST"><span>Center JUST</span></div>
    <div class="score">Correct: <b id="scoreNow">0</b></div>
  </div>
  <div class="topbar" style="margin-bottom:8px"><div id="progressText"></div></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="card">
    <span class="qtype" id="qtype"></span>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="next" id="nextWrap"><button class="btn" id="nextBtn">Next question &rarr;</button></div>
  </div>
</section>

<section id="result" class="screen">
  <div class="card center">
    <div class="resbrand"><img data-logo="1" alt="Center JUST logo"><div>Center JUST</div></div>
    <div class="rule"></div>
    <h1>Quiz Complete</h1>
    <div class="final" id="finalScore"></div>
    <div class="pct" id="finalPct"></div>
    <p class="msg" id="finalMsg"></p>
    <button class="btn" id="restartBtn">Restart the Quiz</button>
  </div>
</section>

</div>

"use strict";
var QUIZ_TITLE = "Int. Law Quiz 4";

/* t = True/False (ans is a boolean). m = Multiple choice (a = correct option, w = wrong options). */
var QUESTIONS = [
{t:"tf",q:"Negotiation constitutes the first phase in the process of concluding international treaties.",ans:true,e:"Negotiation opens the treaty-making process; drafting, adoption, authentication and consent to be bound come afterwards."},
{t:"tf",q:"Negotiation can only take place through diplomatic channels.",ans:false,e:"Negotiation may also be conducted at international conferences or within international organizations, not only through diplomatic channels."},
{t:"tf",q:"If negotiations succeed, either wholly or partly, the negotiating parties proceed to draft the provisions of the treaty.",ans:true,e:"Successful negotiation, even if only partial, leads the parties to the drafting of the treaty provisions."},
{t:"tf",q:"Every international treaty is legally required to contain a preamble, corpus, and final provisions.",ans:false,e:"Most treaties follow this structure, but it is a common practice rather than a legal requirement for every treaty."},
{t:"tf",q:"A treaty may be drafted in one or more languages.",ans:true,e:"There is no restriction to a single language; a treaty can be drafted in one language or in several."},
{t:"tf",q:"As a general rule, the text of a treaty is adopted by the consent of all states participating in its drafting.",ans:true,e:"The general rule is adoption by the consent of all the states that took part in drafting the text."},
{t:"tf",q:"At an international conference, the text of a treaty is always adopted unanimously.",ans:false,e:"At an international conference the text is normally adopted by a two-thirds majority of the states present and voting, so unanimity is not always required."},
{t:"tf",q:"Authentication means that the text of the treaty is considered definitive and finalized.",ans:true,e:"Authentication establishes the treaty text as definitive and final."},
{t:"tf",q:"After authentication, the parties may freely modify the treaty text without renegotiation.",ans:false,e:"Once authenticated, the text is definitive; changing it would require renegotiation."},
{t:"tf",q:"A signature ad referendum becomes a full signature if it is confirmed.",ans:true,e:"A signature ad referendum is given subject to confirmation, and once confirmed it has the effect of a full signature."},
{t:"tf",q:"Exchange of instruments can express consent to be bound when the instruments themselves provide for that effect or the states otherwise agree.",ans:true,e:"An exchange of instruments constituting a treaty can express consent to be bound where the instruments so provide or the states agree."},
{t:"tf",q:"Ratification always takes place before the signature of a treaty.",ans:false,e:"Ratification follows signature: a state signs first and then ratifies, where ratification is required."},
{t:"tf",q:"A state that signs a treaty subject to ratification is legally obliged to ratify it.",ans:false,e:"Ratification is facultative. Signing does not oblige a state to ratify, although it must act in good faith in the meantime."},
{t:"tf",q:"Accession allows a state that was not a signatory to a treaty to become a party to it.",ans:true,e:"Accession is the means by which a non-signatory state can become a party to a treaty."},
{t:"tf",q:"Failure to register a treaty automatically makes the treaty non-binding between its parties.",ans:false,e:"The treaty remains binding between its parties; the consequence is that it may not be invoked before any organ of the United Nations."},

{t:"mc",q:"What is the first phase in the process of concluding an international treaty?",a:"Negotiation",w:["Authentication","Ratification","Registration"],e:"Negotiation is the opening phase. Authentication, ratification and registration come later."},
{t:"mc",q:"Which of the following is NOT a method of conducting treaty negotiations?",a:"National courts",w:["Diplomatic channels","International conferences","International organizations"],e:"Negotiations take place through diplomatic channels, at international conferences or within international organizations, but not through national courts."},
{t:"mc",q:"Which part of a treaty contains its subject matter?",a:"Corpus",w:["Preamble","Final provisions","Ratification clause"],e:"The corpus is the main body of the treaty and contains its substantive provisions."},
{t:"mc",q:"Which of the following may be included in the final provisions of a treaty?",a:"Duration and entry into force",w:["Names of all judges","Domestic criminal penalties","Election procedures"],e:"Final provisions deal with matters such as the treaty's duration and its entry into force."},
{t:"mc",q:"At an international conference, the text of a treaty is normally adopted by:",a:"Two-thirds of the states present and voting",w:["A simple majority of all states","Unanimous consent in every case","One-third of the states present"],e:"The usual rule at an international conference is adoption by a two-thirds majority of the states present and voting."},
{t:"mc",q:"What is the main effect of authentication?",a:"It makes the treaty text definitive and final",w:["It terminates the treaty","It registers the treaty with the United Nations","It automatically ratifies the treaty"],e:"Authentication fixes the text of the treaty as definitive and final; it does not ratify, register or terminate it."},
{t:"mc",q:"Which of the following is a recognized form of signature?",a:"Signature ad referendum",w:["Conditional accession","Parliamentary signature","Judicial signature"],e:"Signature ad referendum is a recognized form of signature, given subject to later confirmation."},
{t:"mc",q:"Signature ad referendum:",a:"Is given subject to confirmation",w:["Is always immediately binding","Cannot become a full signature","Is equivalent to accession"],e:"It is provisional until confirmed, and once confirmed it becomes a full signature."},
{t:"mc",q:"Under the principle of good faith, a state that has signed a treaty must:",a:"Refrain from acts capable of frustrating the object of the treaty until it makes clear its intention not to become a party",w:["Ratify the treaty immediately, since signature creates a binding duty to do so at once","Register the treaty immediately and refuse any further discussion of its content","Amend its domestic constitution to match the treaty before taking any other step"],e:"Good faith requires a signatory to avoid acts that would defeat the treaty's object until it clearly states it does not intend to become a party."},
{t:"mc",q:"Ratification consists of obtaining:",a:"Approval of the competent national authority",w:["Approval of every UN member","Permission from an international court","Approval of the treaty depositary only"],e:"Ratification is the approval of the treaty by the competent authority within the state."},
{t:"mc",q:"Which of the following is NOT a reason for requiring ratification?",a:"Allowing states to rewrite the treaty without renegotiation",w:["Giving governments additional time to study the treaty","Taking account of constitutional requirements","Preventing possible invalidation caused by lack of constitutional authority"],e:"Ratification gives time for study, respects constitutional requirements and avoids invalidity for lack of authority; it does not allow rewriting the treaty without renegotiation."},
{t:"mc",q:"According to the facultative character of ratification:",a:"A state cannot be obliged to ratify merely because it signed",w:["Every signatory state must ratify","Parliament must always approve every treaty","Ratification is unnecessary in all treaties"],e:"Ratification is optional for the state: signing alone does not create an obligation to ratify."},
{t:"mc",q:"Accession primarily allows:",a:"A non-signatory state to become a party to a treaty",w:["A state to withdraw automatically from a treaty","The United Nations to modify a treaty","A signatory state to avoid all treaty obligations"],e:"Accession lets a state that did not sign the treaty become a party to it."},
{t:"mc",q:"As a general rule, consent expressed by signature, ratification, or accession relates to:",a:"The treaty as a whole",w:["Only the preamble","Only selected articles","Only the final provisions"],e:"Consent to be bound generally covers the entire treaty, not just parts of it."},
{t:"mc",q:"What is the consequence of failing to register a treaty?",a:"The treaty may not be invoked before any organ of the United Nations",w:["The treaty becomes void","The treaty ceases to bind the parties","The treaty must be renegotiated"],e:"A treaty that is not registered remains binding between its parties, but it cannot be invoked before any organ of the United Nations."}
];

Array.prototype.forEach.call(document.querySelectorAll("img[data-logo]"),function(i){i.src=LOGO;});
var $ = function(id){return document.getElementById(id);};
var order = [], idx = 0, score = 0, answered = false;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function show(id){["intro","game","result"].forEach(function(s){$(s).classList.toggle("active",s===id);});window.scrollTo({top:0,behavior:"smooth"});}

var total = QUESTIONS.length;
var tfCount = QUESTIONS.filter(function(q){return q.t==="tf";}).length;
var mcCount = total - tfCount;
document.title = QUIZ_TITLE + " | Center JUST";
$("quizTitle").textContent = QUIZ_TITLE;
$("chips").innerHTML = '<span class="chip"><b>'+total+'</b> Questions</span><span class="chip"><b>'+tfCount+'</b> True / False</span><span class="chip"><b>'+mcCount+'</b> Multiple Choice</span>';

function startQuiz(){
  order = shuffle(QUESTIONS.map(function(_,i){return i;}));
  idx = 0; score = 0;
  $("scoreNow").textContent = "0";
  show("game"); render();
}

function render(){
  answered = false;
  var q = QUESTIONS[order[idx]];
  $("progressText").textContent = "Question " + (idx+1) + " of " + total;
  $("barFill").style.width = (idx/total*100) + "%";
  $("qtype").textContent = q.t==="tf" ? "True or False" : "Multiple Choice";
  $("qtext").textContent = q.q;
  var box = $("opts"); box.innerHTML = "";
  var fb = $("fb"); fb.className = "fb"; fb.innerHTML = "";
  $("nextWrap").classList.remove("show");
  $("nextBtn").innerHTML = (idx===total-1) ? "See my score &rarr;" : "Next question &rarr;";
  var items;
  if(q.t==="tf"){
    box.className = "opts tf";
    items = [{text:"True",val:true},{text:"False",val:false}];
    items.forEach(function(it){it.ok = (it.val===q.ans);});
  } else {
    box.className = "opts";
    items = shuffle([{text:q.a,ok:true}].concat(q.w.map(function(x){return {text:x,ok:false};})));
  }
  items.forEach(function(it,i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    if(q.t==="mc"){var l=document.createElement("span");l.className="l";l.textContent="ABCD".charAt(i);b.appendChild(l);}
    var s = document.createElement("span"); s.textContent = it.text; b.appendChild(s);
    b.addEventListener("click", function(){choose(b,it.ok,q);});
    b._ok = it.ok;
    box.appendChild(b);
  });
}

function choose(btn, ok, q){
  if(answered) return; answered = true;
  var btns = $("opts").querySelectorAll(".opt");
  btns.forEach(function(b){
    b.disabled = true;
    if(b===btn){b.classList.add(ok?"correct":"wrong");}
    else if(b._ok && !ok){b.classList.add("correct");}
    else {b.classList.add("dim");}
  });
  if(ok){score++; $("scoreNow").textContent = score;}
  var fb = $("fb");
  fb.className = "fb show " + (ok?"ok":"no");
  fb.innerHTML = "";
  var h = document.createElement("strong"); h.textContent = ok ? "Correct!" : "Incorrect";
  var p = document.createElement("span"); p.textContent = q.e;
  fb.appendChild(h); fb.appendChild(p);
  $("barFill").style.width = ((idx+1)/total*100) + "%";
  $("nextWrap").classList.add("show");
  $("nextBtn").focus({preventScroll:true});
}

function next(){
  if(!answered) return;
  idx++;
  if(idx>=total){finish();} else {render();}
}

function finish(){
  $("finalScore").textContent = score + " / " + total;
  var pc = Math.round(score/total*100);
  $("finalPct").textContent = pc + "% correct";
  var m = pc===100 ? "Perfect score! Outstanding mastery of the subject." :
          pc>=80 ? "Excellent work! You have a strong command of the material." :
          pc>=60 ? "Good effort! A little more review and you will master it." :
          "Keep studying and try again. Practice makes perfect.";
  $("finalMsg").textContent = m;
  show("result");
  if(pc>=60) confetti();
}

function confetti(){
  var c = $("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  var cols = ["#c9a24b","#e6c878","#1f5fd1","#f6efdc","#ffffff"], ps = [];
  for(var i=0;i<120;i++) ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.6,s:5+Math.random()*7,v:2+Math.random()*3.5,r:Math.random()*6,d:(Math.random()-.5)*2,c:cols[i%cols.length]});
  var f = 0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){p.y+=p.v;p.x+=p.d;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++f<260) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);
  })();
}

$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", next);
$("restartBtn").addEventListener("click", startQuiz);
</script>
