<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Int. Law Quiz 9 — Center JUST</title>
<style>
:root{--navy:#060E24;--navy2:#0B1633;--gold:#D6B158;--gold2:#F0D88F;--ink:#1B2236;--parch:#F6EEDB;--parch2:#EADFC3;--blue:#2454BE;--bad:#C93B3B;--mute:#A9B6D3;--white:#F4F7FC}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--white);background:var(--navy);display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 100% 0%,rgba(36,84,190,.32),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(214,177,88,.08),transparent 50%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45)),var(--navy)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.5)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;object-fit:contain}
.brand b{font-family:Georgia,serif;font-size:20px;letter-spacing:.06em;color:var(--gold2);white-space:nowrap}
.hlabel{font-size:11px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:4px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}
main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:26px 16px 34px}
.screen{display:none;animation:rise .5s ease both}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(214,177,88,.45);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
/* intro */
.intro{text-align:center;padding:34px 22px}
.intro .logo{width:190px;max-width:55%;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.wordmark{font-family:Georgia,serif;font-size:26px;letter-spacing:.12em;color:var(--gold2);margin-top:8px}
.intro h1{font-family:Georgia,serif;font-weight:700;font-size:clamp(30px,6vw,44px);margin:20px 0 10px;line-height:1.15}
.rule{width:90px;height:2px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sub{color:var(--mute);font-size:17px;line-height:1.5;max-width:460px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 26px}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:999px;padding:7px 16px;font-size:14px;color:var(--gold2);background:rgba(214,177,88,.07)}
.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px 30px;font-size:17px;font-weight:700;letter-spacing:.03em;color:#1c1500;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 6px 20px rgba(214,177,88,.28);transition:transform .15s,box-shadow .15s;min-height:50px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.4)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
/* quiz */
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:15px;color:var(--mute);gap:10px}
.meta .score{color:var(--gold2);font-weight:700}
.meta .tag{display:inline-block;margin-right:10px;padding:2px 10px;border-radius:999px;border:1px solid rgba(214,177,88,.5);font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.card{background:linear-gradient(160deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;padding:26px 22px;border:2px solid var(--gold);box-shadow:0 14px 44px rgba(0,0,0,.55),inset 0 0 0 4px rgba(214,177,88,.18)}
.card h2{font-family:Georgia,serif;font-size:clamp(20px,4.4vw,25px);line-height:1.4;font-weight:700;margin-bottom:20px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:17px;line-height:1.4;color:var(--ink);background:rgba(255,255,255,.62);border:2px solid rgba(120,90,20,.35);border-radius:12px;padding:13px 15px;cursor:pointer;min-height:56px;transition:transform .15s,background .2s,border-color .2s,opacity .3s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold);background:#fff}
.opt .b{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--navy2);color:var(--gold2);transition:background .2s}
.opt:disabled{cursor:default}
.opt.ok{background:var(--blue);border-color:#17399a;color:#fff;animation:pop .4s}
.opt.ok .b{background:#fff;color:var(--blue)}
.opt.no{background:var(--bad);border-color:#8f2222;color:#fff;animation:shake .4s}
.opt.no .b{background:#fff;color:var(--bad)}
.opt.fade{opacity:.45}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;font-size:16px;line-height:1.5}
.fb.show{display:block;animation:rise .35s both}
.fb.good{background:rgba(36,84,190,.12);border-left:5px solid var(--blue)}
.fb.bad{background:rgba(201,59,59,.1);border-left:5px solid var(--bad)}
.fb b{display:block;font-family:Georgia,serif;font-size:19px;margin-bottom:4px}
.fb.good b{color:var(--blue)}.fb.bad b{color:var(--bad)}
.nextrow{display:flex;justify-content:flex-end;margin-top:18px;min-height:52px}
.nextrow .btn{display:none}
.nextrow .btn.show{display:inline-block;animation:rise .3s both}
/* results */
.res{text-align:center;padding:30px 20px}
.ring{width:190px;height:190px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--p,0%),rgba(214,177,88,.15) 0)}
.ring div{width:160px;height:160px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;font-family:Georgia,serif;font-size:50px;color:var(--gold2);font-weight:700}
.big{font-family:Georgia,serif;font-size:26px}
.msg{color:var(--mute);margin:8px 0 22px;font-size:17px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;padding:16px;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;border-top:1px solid rgba(214,177,88,.25)}
@media(max-width:560px){header{padding:10px 12px}.brand img{width:38px;height:38px}.brand b{font-size:17px}.hlabel{font-size:10px;letter-spacing:.12em}.card{padding:20px 15px}.opt{font-size:16px;padding:12px}.btn{width:100%}.nextrow .btn{width:auto}footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
var QUESTIONS = [{"type": "tf", "q": "International custom historically preceded international treaties and played an important role in developing international law.", "a": true, "exp": "Correct. Custom came before treaties and was central to the development of international law."}, {"type": "tf", "q": "A customary international rule cannot exist unless it is formally recorded in a written international agreement.", "a": false, "exp": "Correct answer: False. A customary rule can exist without being recorded in any written agreement."}, {"type": "tf", "q": "The material element of international custom requires consistent and uniform state practice.", "a": true, "exp": "Correct. The material element requires consistent and uniform practice by states."}, {"type": "tf", "q": "Contradictory and inconsistent conduct by states contributes to the formation of a customary international rule.", "a": false, "exp": "Correct answer: False. Contradictory, inconsistent conduct does not form a customary rule; consistency is required."}, {"type": "tf", "q": "The development of science, technology, and international communications has accelerated the formation of customary international rules.", "a": true, "exp": "Correct. Advances in science, technology and communications have sped up how quickly custom forms."}, {"type": "tf", "q": "A persistent objector may avoid the application of a customary rule during its formation, even when that rule is a norm of jus cogens.", "a": false, "exp": "Correct answer: False. Persistent objection cannot shield a state from a rule of jus cogens."}, {"type": "tf", "q": "Opinio juris requires states to believe that their conduct is legally obligatory rather than merely motivated by courtesy or political convenience.", "a": true, "exp": "Correct. Opinio juris means states act out of a sense of legal obligation, not courtesy or convenience."}, {"type": "tf", "q": "The burden of proving the existence of a regional custom generally lies on the party invoking it.", "a": true, "exp": "Correct. The party invoking a regional custom generally bears the burden of proving it."}, {"type": "tf", "q": "Bilateral customary rules are legally impossible because international custom must involve at least three states.", "a": false, "exp": "Correct answer: False. Bilateral custom is possible; custom need not involve three or more states."}, {"type": "tf", "q": "A state's withdrawal from a treaty automatically releases it from all corresponding obligations under customary international law.", "a": false, "exp": "Correct answer: False. Withdrawing from a treaty does not automatically release a state from the parallel obligations under customary law."}, {"type": "tf", "q": "The declaratory aspect of codification involves the precise formulation and systematization of already existing customary international rules.", "a": true, "exp": "Correct. The declaratory aspect of codification formulates and systematizes rules that already exist as custom."}, {"type": "tf", "q": "An international court may apply international custom even if neither party has expressly invoked it.", "a": true, "exp": "Correct. A court may apply custom even when neither party has invoked it."}, {"type": "tf", "q": "General principles borrowed from domestic legal systems may be automatically incorporated into international law without considering the nature of the international legal system.", "a": false, "exp": "Correct answer: False. Domestic principles can be applied only after considering the nature of the international legal system."}, {"type": "tf", "q": "Under general principles of law, a person may act as a judge in their own case if both parties belong to the same state.", "a": false, "exp": "Correct answer: False. No one may be a judge in their own case, regardless of the parties' nationality."}, {"type": "tf", "q": "The principle of good faith prevents a state from taking advantage of its own unlawful conduct and requires parties to fulfill their treaty obligations.", "a": true, "exp": "Correct. Good faith bars a state from profiting from its own wrongdoing and requires treaty obligations to be fulfilled."}, {"type": "mc", "q": "According to Article 38 of the Statute of the International Court of Justice, international custom is defined as:", "opts": ["A written agreement concluded between sovereign states.", "Evidence of a general practice accepted as law.", "A judicial decision binding all international organizations.", "A political practice followed exclusively for diplomatic convenience."], "a": 1, "exp": "Custom is evidence of a general practice accepted as law."}, {"type": "mc", "q": "Which of the following represents the two essential elements of international custom?", "opts": ["Treaty ratification and judicial enforcement.", "State sovereignty and international cooperation.", "Material practice and opinio juris.", "Diplomatic recognition and international arbitration."], "a": 2, "exp": "Custom rests on two elements: material practice and opinio juris."}, {"type": "mc", "q": "Which of the following is NOT considered a principal indicator of international custom?", "opts": ["International jurisprudence.", "International arbitration.", "Decisions of international organizations.", "Personal preferences of individual citizens."], "a": 3, "exp": "Personal preferences of individual citizens are not an indicator of custom; jurisprudence, arbitration and decisions of international organizations are."}, {"type": "mc", "q": "A state has openly, clearly, and consistently objected to an emerging customary international rule since its inception. Under which condition may the state avoid being bound by that rule?", "opts": ["When the rule is a norm of jus cogens.", "When the objection is made only after the rule becomes established.", "When the objection is persistent and the rule is not a norm of jus cogens.", "When the objection is based exclusively on economic inconvenience."], "a": 2, "exp": "A persistent objection from the start lets a state avoid the rule, unless the rule is jus cogens."}, {"type": "mc", "q": "Which of the following is an example of universal custom?", "opts": ["A fishing arrangement existing exclusively between two neighboring states.", "The prohibition of piracy on the high seas.", "A hospitality practice limited to a particular region.", "A regional asylum practice in the American continent."], "a": 1, "exp": "The prohibition of piracy on the high seas is a universal custom; the other examples are limited to a few states or a region."}, {"type": "mc", "q": "The doctrine of Uti Possidetis primarily establishes that:", "opts": ["Newly independent states must negotiate entirely new borders.", "Colonial boundaries automatically disappear upon independence.", "Newly independent states inherit the boundaries existing at the time of independence.", "International organizations have exclusive authority to determine all national borders."], "a": 2, "exp": "Uti possidetis means newly independent states inherit the boundaries existing at independence."}, {"type": "mc", "q": "Two neighboring states develop a consistent practice allowing their fishermen reciprocal access to each other's territorial waters. This arrangement is best classified as:", "opts": ["Universal custom.", "Regional custom involving an entire continent.", "Bilateral custom.", "A general principle of domestic law."], "a": 2, "exp": "A practice shared by two neighboring states is a bilateral custom."}, {"type": "mc", "q": "Which statement most accurately describes the relationship between treaties and customary international law?", "opts": ["Treaties always prevail over customary rules.", "Customary rules always prevail over treaties, regardless of their nature.", "There is generally no hierarchy between treaties and custom, while jus cogens norms have a special superior status.", "Customary rules cease to exist whenever they are incorporated into treaties."], "a": 2, "exp": "There is generally no hierarchy between treaties and custom, but jus cogens norms hold a special superior status."}, {"type": "mc", "q": "Which of the following best describes the progressive development aspect of codification?", "opts": ["Restating existing customary rules without introducing any changes.", "Preparing new rules or modifying established rules to regulate matters that are not yet sufficiently developed.", "Eliminating all customary rules in favor of domestic legislation.", "Restricting international law exclusively to judicial precedents."], "a": 1, "exp": "Progressive development prepares new rules or modifies existing ones where a matter is not yet sufficiently developed."}, {"type": "mc", "q": "Which of the following bodies has participated in the codification of international law?", "opts": ["The International Law Commission.", "The World Health Organization exclusively.", "National criminal courts exclusively.", "Private commercial associations exclusively."], "a": 0, "exp": "The International Law Commission has participated in codifying international law."}, {"type": "mc", "q": "What is one of the principal functions of general principles of law in the international legal system?", "opts": ["To eliminate the need for international treaties.", "To fill gaps in positive sources of international law and avoid non liquet decisions.", "To replace all rules of customary international law.", "To allow international courts to disregard their jurisdictional limitations."], "a": 1, "exp": "General principles fill gaps in the positive sources of international law and help avoid non liquet decisions."}, {"type": "mc", "q": "Which of the following conditions must be satisfied before a principle borrowed from domestic law can be applied in international law?", "opts": ["It must be recognized exclusively by one powerful state.", "It must conflict with existing international rules.", "It must be accepted by major legal systems, compatible with international law, and appropriate to the international legal system.", "It must originate exclusively from criminal law."], "a": 2, "exp": "A domestic principle must be accepted by major legal systems, be compatible with international law, and suit the international legal system."}, {"type": "mc", "q": "A tribunal decides a dispute by applying its own perception of fairness rather than the parties' legal rights, without any authorization or agreement permitting it to do so. Which principle has the tribunal violated?", "opts": ["The principle of reciprocity.", "The principle that tribunals must base their decisions on legal rights unless otherwise authorized or agreed.", "The principle of freedom of the high seas.", "The principle of territorial integrity."], "a": 1, "exp": "Tribunals must base decisions on legal rights unless authorized or agreed otherwise; applying their own sense of fairness violates this."}, {"type": "mc", "q": "A state initially acknowledges a particular legal position but later denies that same position to obtain an advantage in an international dispute. Which principle is most directly relevant?", "opts": ["Res judicata.", "Uti possidetis.", "Estoppel.", "Force majeure."], "a": 2, "exp": "Estoppel prevents a state from denying a position it previously acknowledged in order to gain an advantage."}, {"type": "mc", "q": "Which statement concerning general principles of international law is correct?", "opts": ["They are entirely independent and must never be interpreted together.", "They are necessarily contradictory and cannot operate simultaneously.", "They are interrelated and complementary, and should be interpreted in the context of other principles.", "They apply only to states that have signed a specific international convention."], "a": 2, "exp": "General principles are interrelated and complementary, and are interpreted in the context of other principles."}];
(function(){
  var TOTAL=QUESTIONS.length, nTF=0, nMC=0;
  QUESTIONS.forEach(function(q){ if(q.type==="tf") nTF++; else nMC++; });
  var $=function(id){return document.getElementById(id)};
  function show(id){["s-intro","s-quiz","s-res"].forEach(function(s){$(s).classList.toggle("on",s===id)}); window.scrollTo(0,0);}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  $("chips").innerHTML='<span class="chip">'+TOTAL+' Questions</span><span class="chip">'+nTF+' True / False</span><span class="chip">'+nMC+' Multiple Choice</span>';
  var order=[],idx=0,correct=0,answered=false;
  function begin(){
    order=shuffle(QUESTIONS.map(function(_,i){return i}));
    idx=0;correct=0;show("s-quiz");render();
  }
  function render(){
    answered=false;
    var q=QUESTIONS[order[idx]];
    $("qtype").textContent=q.type==="tf"?"True / False":"Multiple Choice";
    $("qpos").textContent="Question "+(idx+1)+" of "+TOTAL;
    $("qscore").textContent=correct+" correct";
    $("qtext").textContent=q.q;
    $("bar").style.width=(idx/TOTAL*100)+"%";
    var fb=$("fb");fb.className="fb";fb.innerHTML="";
    $("next").className="btn";
    $("next").textContent=idx===TOTAL-1?"See my score":"Next question";
    var items;
    if(q.type==="tf") items=[{t:"True",ok:q.a===true},{t:"False",ok:q.a===false}];
    else items=shuffle(q.opts.map(function(t,i){return{t:t,ok:i===q.a}}));
    var box=$("opts");box.innerHTML="";
    items.forEach(function(it,i){
      var b=document.createElement("button");b.type="button";b.className="opt";
      var badge=document.createElement("span");badge.className="b";badge.textContent=q.type==="tf"?(i===0?"T":"F"):"ABCD".charAt(i);
      var tx=document.createElement("span");tx.textContent=it.t;
      b.appendChild(badge);b.appendChild(tx);b._ok=it.ok;
      b.onclick=function(){choose(b)};
      box.appendChild(b);
    });
  }
  function choose(btn){
    if(answered)return;answered=true;
    var good=btn._ok;if(good)correct++;
    var all=document.querySelectorAll("#opts .opt"),right="";
    all.forEach(function(o){
      o.disabled=true;
      if(o._ok){o.classList.add("ok");right=o.children[1].textContent}
      else if(o===btn){o.classList.add("no")}
      else o.classList.add("fade");
    });
    var q=QUESTIONS[order[idx]];
    var fb=$("fb");
    fb.className="fb show "+(good?"good":"bad");
    var h=document.createElement("b");h.textContent=good?"Correct!":"Incorrect";
    var p=document.createElement("div");p.textContent=q.exp;
    fb.appendChild(h);fb.appendChild(p);
    $("qscore").textContent=correct+" correct";
    $("bar").style.width=((idx+1)/TOTAL*100)+"%";
    $("next").className="btn show";
  }
  function finish(){
    show("s-res");
    var p=Math.round(correct/TOTAL*100);
    $("final").textContent=correct+" / "+TOTAL+" correct";
    $("msg").textContent=p>=90?"Outstanding work!":p>=70?"Well done — a strong result.":p>=50?"Good effort. Review and try again.":"Keep practicing — you can do better.";
    $("ring").style.setProperty("--p","0%");
    var n=0,step=Math.max(1,Math.ceil(p/40));
    var t=setInterval(function(){n=Math.min(p,n+step);$("pct").textContent=n+"%";$("ring").style.setProperty("--p",n+"%");if(n>=p)clearInterval(t)},25);
    $("bar").style.width="100%";
  }
  $("start").onclick=begin;
  $("restart").onclick=begin;
  $("next").onclick=function(){ if(!answered)return; if(idx<TOTAL-1){idx++;render()}else finish(); };
  document.addEventListener("keydown",function(e){
    if(!$("s-quiz").classList.contains("on"))return;
    if(e.key==="Enter"&&answered){$("next").click();return}
    var k=e.key.toLowerCase(),i="abcd".indexOf(k);
    if(!answered&&i>-1){var o=document.querySelectorAll("#opts .opt")[i];if(o)o.click()}
    if(!answered&&(k==="t"||k==="f")&&QUESTIONS[order[idx]].type==="tf"){document.querySelectorAll("#opts .opt")[k==="t"?0:1].click()}
  });
})();
</script>
</body>
