<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Int. Law Quiz 7 · Center JUST</title>
<style>
:root{--navy:#070d1f;--navy2:#0d1730;--gold:#c9a45c;--gold2:#e6c985;--parch:#f4ecd8;--parch2:#eadfc3;--ink:#1d2233;--blue:#2454be;--red:#c93c3c;--muted:#a9b3cc}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;color:#f4efe2;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,rgba(36,84,190,.28),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(201,164,92,.10),transparent 60%),linear-gradient(180deg,#0a1226,#050912)}
.serif{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
header.top{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(201,164,92,.45)}
header.top img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px rgba(201,164,92,.6)}
header.top .nm{font-family:Georgia,serif;font-size:20px;letter-spacing:.14em;color:var(--gold2);font-weight:bold}
header.top .lb{margin-left:auto;font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;text-align:right}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin:10px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.screen{display:none;animation:fade .4s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* intro */
.intro{text-align:center;padding:18px 6px}
.intro .big{width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 3px rgba(201,164,92,.7),0 0 50px rgba(201,164,92,.25);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.intro .brand{font-family:Georgia,serif;font-size:28px;letter-spacing:.28em;color:var(--gold2);margin-top:14px;font-weight:bold}
.intro h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,44px);margin:16px 0 8px;color:#fff;line-height:1.15}
.rule{width:90px;height:2px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.intro p.sub{color:var(--muted);font-size:17px;line-height:1.5;max-width:520px;margin:0 auto}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0}
.chip{border:1px solid rgba(201,164,92,.5);background:rgba(201,164,92,.08);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--gold2)}
.chip b{color:#fff}
.btn{appearance:none;border:0;cursor:pointer;font-family:Georgia,serif;font-weight:bold;font-size:18px;letter-spacing:.06em;padding:16px 34px;border-radius:12px;color:#1a1405;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 6px 22px rgba(201,164,92,.28);transition:transform .15s,box-shadow .15s;min-height:54px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(201,164,92,.4)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
/* question */
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:12px;gap:10px}
.meta .score{color:var(--gold2);font-weight:600}
.meta .kind{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;padding:24px 22px;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 2px rgba(201,164,92,.7)}
.card .qt{font-family:Georgia,serif;font-size:clamp(19px,4.6vw,24px);line-height:1.45;font-weight:600}
.opts{display:grid;gap:11px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font:inherit;font-size:16.5px;line-height:1.4;color:var(--ink);background:#fffaf0;border:2px solid #d5c59b;border-radius:12px;padding:13px 14px;min-height:56px;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px);background:#fff}
.opt .bd{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:bold;background:#1b2a52;color:var(--gold2)}
.opt:disabled{cursor:default}
.opt.fade{opacity:.5}
.opt.ok{background:var(--blue);border-color:#173a8a;color:#fff;opacity:1;animation:pop .35s}
.opt.ok .bd{background:#fff;color:var(--blue)}
.opt.bad{background:var(--red);border-color:#9b2626;color:#fff;opacity:1;animation:shake .4s}
.opt.bad .bd{background:#fff;color:var(--red)}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;border-radius:12px;padding:14px 16px;font-size:15.5px;line-height:1.5}
.fb.on{display:block;animation:fade .3s}
.fb.good{background:rgba(36,84,190,.12);border-left:5px solid var(--blue)}
.fb.wrong{background:rgba(201,60,60,.1);border-left:5px solid var(--red)}
.fb strong{display:block;font-family:Georgia,serif;font-size:18px;margin-bottom:4px}
.fb.good strong{color:var(--blue)}.fb.wrong strong{color:var(--red)}
.next{display:none;justify-content:flex-end;margin-top:18px}
.next.on{display:flex}
/* results */
.res{text-align:center;padding:10px 0}
.res img{width:110px;height:110px;border-radius:50%;box-shadow:0 0 0 3px rgba(201,164,92,.7)}
.res .pct{font-family:Georgia,serif;font-size:76px;color:var(--gold2);line-height:1;margin-top:14px;font-weight:bold}
.res .ct{font-family:Georgia,serif;font-size:26px;margin:8px 0 4px}
.res .msg{color:var(--muted);margin-bottom:22px}
footer{margin-top:34px;text-align:center;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
@media(max-width:520px){.card{padding:18px 14px}.opt{font-size:16px}.intro .big{width:150px;height:150px}header.top .nm{font-size:17px}.btn{width:100%}.next .btn{width:100%}}
</style>
</head>

var DATA=[{"t": "tf", "q": "International treaties produce two main types of effects: ratione personae and ratione materiae.", "a": true, "e": "Treaty effects are classified as ratione personae and ratione materiae."}, {"t": "tf", "q": "The direct legal effects of a treaty are, in principle, binding on all states, including those that are not parties to it.", "a": false, "e": "Direct legal effects bind the parties only; third states are not bound in principle."}, {"t": "tf", "q": "Rights and obligations created by international treaties are generally international, contractual, obligatory, and reciprocal in nature.", "a": true, "e": "These four characteristics describe the rights and obligations treaties create."}, {"t": "tf", "q": "Treaty obligations always take precedence over general rules of international law, including jus cogens rules.", "a": false, "e": "Treaty obligations do not always prevail; they cannot override jus cogens rules."}, {"t": "tf", "q": "The principle ex consensu advenit vinculum means that consent gives rise to international obligations.", "a": true, "e": "Ex consensu advenit vinculum: the obligation arises from consent."}, {"t": "tf", "q": "Under the principle of pacta sunt servanda, parties may perform their treaty obligations arbitrarily as long as they eventually fulfill them.", "a": false, "e": "Pacta sunt servanda requires performance in good faith, not arbitrary performance."}, {"t": "tf", "q": "The principle of good faith governs international treaties from their formation through their implementation until their extinction.", "a": true, "e": "Good faith governs a treaty throughout its life: formation, implementation and extinction."}, {"t": "tf", "q": "A change in a state's government or presidency automatically releases it from its existing treaty obligations.", "a": false, "e": "The state continues to exist, so a change of government or president does not release it from its treaties."}, {"t": "tf", "q": "A state may invoke conflicting provisions of its domestic law to justify its failure to perform an international treaty.", "a": false, "e": "Domestic law cannot be invoked to justify non-performance of a treaty."}, {"t": "tf", "q": "The severance of diplomatic or consular relations between contracting parties does not, by itself, justify non-performance of their treaty obligations.", "a": true, "e": "Severing diplomatic or consular relations does not, by itself, excuse non-performance."}, {"t": "tf", "q": "Unless a different intention appears or is otherwise established, a treaty is binding upon each party in respect of its entire territory.", "a": true, "e": "This is the general rule of ratione loci."}, {"t": "tf", "q": "If a treaty does not specify when it enters into force, it automatically becomes effective upon the consent of the first negotiating state.", "a": false, "e": "Entry into force does not depend on the consent of the first negotiating state alone."}, {"t": "tf", "q": "Provisional application allows a treaty or part of it to be applied before the competent internal authorities ratify, accept, or approve it.", "a": true, "e": "Provisional application lets a treaty, or part of it, operate before internal approval is completed."}, {"t": "tf", "q": "The principle of non-retroactivity means that international treaties normally apply to events occurring before their entry into force.", "a": false, "e": "Non-retroactivity means treaties normally do not apply to events before their entry into force."}, {"t": "tf", "q": "Under the principle of tempus regit factum, an action that was lawful when performed does not become invalid merely because the law subsequently changes.", "a": true, "e": "Tempus regit factum: an act is judged by the law in force when it was performed."}, {"t": "mc", "q": "Which of the following represents the three levels of ratione personae effects of international treaties?", "o": ["Territorial, temporal, and provisional effects", "Effects between parties, vis-à-vis third parties, and regarding individuals", "Legislative, judicial, and executive effects", "Political, economic, and military effects"], "a": 1, "e": "Ratione personae effects operate between parties, toward third parties, and regarding individuals."}, {"t": "mc", "q": "Which of the following is NOT one of the main effects of treaties between contracting parties?", "o": ["Creation of rights and obligations", "Compliance with treaty obligations", "Application of the treaty", "Automatic imposition of obligations on all third states"], "a": 3, "e": "Treaties do not automatically impose obligations on third states."}, {"t": "mc", "q": "The reciprocal nature of rights and obligations created by international treaties means that:", "o": ["Only one party receives rights under the treaty", "Treaty obligations are always optional", "Treaties regulate reciprocal relationships between contracting parties", "Contracting parties have no legal responsibilities toward one another"], "a": 2, "e": "Reciprocity means the treaty governs mutual relationships between the contracting parties."}, {"t": "mc", "q": "Which principle establishes that consent creates international obligations?", "o": ["Pacta tertiis", "Ex consensu advenit vinculum", "Tempus regit factum", "Ratione loci"], "a": 1, "e": "Ex consensu advenit vinculum expresses that obligation arises from consent."}, {"t": "mc", "q": "According to pacta sunt servanda, contracting parties must:", "o": ["Perform treaties only when politically convenient", "Respect treaties only during diplomatic cooperation", "Perform their treaty obligations in good faith while the treaties remain in force", "Give domestic legislation priority over treaty obligations"], "a": 2, "e": "Pacta sunt servanda requires good-faith performance for as long as the treaty is in force."}, {"t": "mc", "q": "Which of the following best describes the principle of good faith in international treaty law?", "o": ["States may interpret treaty obligations unpredictably", "States must respect treaty obligations faithfully and avoid arbitrary implementation", "States may disregard legitimate expectations of other parties", "Good faith applies only during treaty negotiations"], "a": 1, "e": "Good faith requires faithful respect for obligations and rules out arbitrary implementation."}, {"t": "mc", "q": "A state signs an international treaty. Subsequently, a new government takes office and announces that the treaty is no longer binding because it was signed by the previous administration. Which principle contradicts this position?", "o": ["Principle of non-retroactivity", "Principle of provisional application", "Principle of continuity of the state", "Principle of limited territorial application"], "a": 2, "e": "The state continues despite a change of government, so its treaty obligations continue too."}, {"t": "mc", "q": "If a state's domestic legislation conflicts with its international treaty obligations, the state must generally:", "o": ["Ignore the treaty and follow domestic law", "Adjust its domestic law to conform to its treaty obligations", "Automatically terminate the treaty", "Suspend all diplomatic relations with other contracting parties"], "a": 1, "e": "Domestic law cannot justify non-performance, so the state must bring its law into line with the treaty."}, {"t": "mc", "q": "State A concludes a treaty with State B. Later, State A concludes another treaty with State C that conflicts with the earlier treaty. If State A fails to fulfill its obligations under one of these treaties, what may happen?", "o": ["Both treaties automatically become invalid", "State A is automatically released from its earlier obligations", "State A may incur international responsibility", "State C automatically becomes a party to the earlier treaty"], "a": 2, "e": "Failing to perform one of the conflicting treaties may engage State A's international responsibility."}, {"t": "mc", "q": "Under the general rule of ratione loci, an international treaty applies to:", "o": ["Only the capital city of each contracting state", "Only territories specifically mentioned in domestic legislation", "The entire territory of each contracting party, unless a different intention appears or is otherwise established", "All territories worldwide, regardless of treaty participation"], "a": 2, "e": "The general rule is application to each party's entire territory, unless a different intention appears."}, {"t": "mc", "q": "Which of the following is NOT one of the five main questions concerning the ratione temporis application of international treaties?", "o": ["Entry into force", "Duration", "Territorial sovereignty", "Non-retroactivity"], "a": 2, "e": "Territorial sovereignty is not a temporal question; entry into force, duration and non-retroactivity are."}, {"t": "mc", "q": "An international treaty requires the consent of 20 states before entering into force. Only 15 states have expressed their consent. What is the legal consequence?", "o": ["The treaty automatically enters into force for all 15 states", "The treaty has not yet entered into force under the specified condition", "The treaty becomes permanently invalid", "The treaty must automatically be applied retroactively"], "a": 1, "e": "Until the required 20 consents are given, the specified condition is unmet and the treaty is not in force."}, {"t": "mc", "q": "Which of the following treaty provisions may operate from the adoption of the treaty text, even before the treaty itself enters into force?", "o": ["All substantive obligations without exception", "Only provisions concerning territorial jurisdiction", "Provisions concerning reservations, authentication, and depositary functions", "Only provisions concerning treaty termination"], "a": 2, "e": "Provisions on reservations, authentication and depositary functions can operate from adoption of the text."}, {"t": "mc", "q": "States A and B agree to apply a treaty provisionally because of an urgent situation. Later, State A notifies the other state that it does not intend to become a party to the treaty. What is the consequence for State A?", "o": ["Its provisional application continues permanently", "Its provisional application terminates", "The entire treaty automatically becomes invalid for every state", "State A must continue provisional application until the treaty expires"], "a": 1, "e": "Notifying an intention not to become a party ends that state's provisional application."}, {"t": "mc", "q": "An international treaty enters into force in 2026. An event occurred in 2024. The treaty expressly provides that its provisions apply to certain events occurring before its entry into force. Which statement is correct?", "o": ["The treaty can never apply to the 2024 event", "The treaty automatically becomes invalid because it contains a retroactive provision", "The treaty may apply retroactively because the parties have expressed a different intention", "The principle of tempus regit factum requires all treaties to apply retroactively"], "a": 2, "e": "Non-retroactivity is a default rule; the parties can express a different intention."}];

  });

function choose(btn){

  for(var i=0;i<all.length;i++){

    else if(o===btn)o.classList.add("bad");

  }
  var fb=$("fb");fb.className="fb on "+(good?"good":"wrong");

  $("nextBtn").focus({preventScroll:true});
  setTimeout(function(){$("nextWrap").scrollIntoView({behavior:"smooth",block:"nearest"})},60);
}

  $("rPct").textContent=pct+"%";
  $("rCount").textContent=correct+" / "+TOTAL;
  $("rMsg").textContent=pct>=90?"Outstanding work!":pct>=70?"Well done!":pct>=50?"Good effort. Keep practicing!":"Keep studying and try again!";
  show("sRes");
}
$("startBtn").addEventListener("click",start);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",start);
})();
</script>
