<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Int. Law Quiz 8 | Center JUST</title>
<style>
:root{--navy:#060E24;--navy2:#0B1A3F;--gold:#C9A24B;--gold2:#E6C97A;--parch:#F6EEDB;--parch2:#EADFC3;--ink:#1B2236;--blue:#2457C5;--red:#C73A3A;--muted:#8E9BBA}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:#F4F1E8;background:var(--navy);display:flex;flex-direction:column;align-items:center;padding:18px 14px 28px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,rgba(36,87,197,.28),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(201,162,75,.10),transparent 60%),linear-gradient(160deg,#0A1530,#050B1C)}
.wrap{width:100%;max-width:760px}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.brand img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.brand .name{font-size:1.5rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin-top:6px;font-weight:700}
.brand .rule{width:90px;height:2px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mini .brand{flex-direction:row;gap:12px;justify-content:center}
.mini .brand img{width:46px;height:46px}.mini .brand .name{font-size:1.05rem;margin:0}.mini .rule{display:none}
.screen{display:none;animation:fade .5s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;border:1px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 4px rgba(201,162,75,.18);padding:26px 22px}
.intro{text-align:center;margin-top:18px}
.eyebrow{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(1.9rem,6vw,2.7rem);margin:8px 0 6px;color:#fff;line-height:1.15}
.sub{color:#CFD6E8;font-family:system-ui,sans-serif;font-size:1.02rem;margin:10px auto 0;max-width:480px}
.stats{display:flex;gap:10px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.stat{flex:1 1 90px;max-width:150px;border:1px solid rgba(201,162,75,.5);background:rgba(255,255,255,.04);border-radius:12px;padding:12px 6px}
.stat b{display:block;font-size:1.8rem;color:var(--gold2)}.stat span{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.btn{font-family:Georgia,serif;font-size:1.1rem;font-weight:700;letter-spacing:.08em;border:0;border-radius:12px;padding:15px 34px;min-height:52px;cursor:pointer;color:#1a1306;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 6px 18px rgba(201,162,75,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(201,162,75,.5)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
.top{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.95rem;margin:14px 2px 8px;color:#DDE3F2;gap:10px}
.top .score{color:var(--gold2);font-weight:700;white-space:nowrap}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease;border-radius:9px}
.badge{display:inline-block;font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;border:1px solid var(--gold);color:#7a5a12;border-radius:20px;padding:4px 11px;margin-bottom:14px}
.qtext{font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.45;margin-bottom:20px;color:var(--ink)}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;min-height:58px;font-family:system-ui,-apple-system,sans-serif;font-size:1.02rem;line-height:1.4;color:var(--ink);background:#FFFBF0;border:2px solid #D8C8A0;border-radius:13px;padding:12px 14px;cursor:pointer;transition:all .18s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px);background:#fff}
.opt .l{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--navy2);color:var(--gold2);font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.correct{background:var(--blue);border-color:#173F93;color:#fff;animation:pop .4s}
.opt.correct .l{background:#fff;color:var(--blue)}
.opt.wrong{background:var(--red);border-color:#8f2222;color:#fff;animation:shake .4s}
.opt.wrong .l{background:#fff;color:var(--red)}
.opt.dim{opacity:.45}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;font-family:system-ui,sans-serif;line-height:1.5;animation:fade .35s}
.fb.ok{display:block;background:rgba(36,87,197,.12);border-left:5px solid var(--blue)}
.fb.no{display:block;background:rgba(199,58,58,.1);border-left:5px solid var(--red)}
.fb b{display:block;font-family:Georgia,serif;font-size:1.1rem;margin-bottom:4px}
.fb.ok b{color:var(--blue)}.fb.no b{color:var(--red)}
.nextrow{display:none;justify-content:flex-end;margin-top:18px}.nextrow.on{display:flex}
.res{text-align:center;margin-top:16px}
.ring{--p:0;width:190px;height:190px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
.ring div{width:156px;height:156px;border-radius:50%;background:var(--navy);display:grid;place-items:center;border:1px solid var(--gold)}
.ring b{font-size:2.6rem;color:var(--gold2)}.ring span{display:block;font-family:system-ui,sans-serif;font-size:.9rem;color:#CFD6E8}
.msg{font-size:1.3rem;margin:8px 0 22px;color:#fff}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{margin-top:26px;font-size:.78rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;text-align:center}
@media(max-width:520px){.card{padding:20px 15px}.brand img{width:100px;height:100px}.btn{width:100%}.nextrow .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
var QS=[{"t": "tf", "q": "A treaty generally creates neither rights nor obligations for third states without their consent.", "a": true, "e": "This is the general rule on third states: a treaty cannot create rights or obligations for them without their consent."}, {"t": "tf", "q": "A third state must always expressly accept a treaty right in writing before benefiting from it.", "a": false, "e": "Express written acceptance is required for obligations, not for rights. A right can be conferred on a third state if the parties intend it."}, {"t": "tf", "q": "A treaty may impose an obligation on a third state if the original parties intend to create that obligation and the third state expressly accepts it in writing.", "a": true, "e": "An obligation can bind a third state only where the parties intend it and the third state expressly accepts it in writing."}, {"t": "tf", "q": "Treaties establishing objective regimes may have legal effects extending beyond their contracting parties.", "a": true, "e": "Objective regimes are an exception to the general rule, since their legal effects can extend beyond the contracting parties."}, {"t": "tf", "q": "The most-favored-nation clause automatically grants benefits even when the clause is not in force.", "a": false, "e": "The clause operates only while it is in force. It does not grant benefits automatically when it is not."}, {"t": "tf", "q": "When all parties to an earlier treaty are also parties to a later treaty concerning the same subject, the earlier treaty applies only to the extent that it is compatible with the later treaty.", "a": true, "e": "Where the parties are identical, the earlier treaty applies only insofar as it is compatible with the later one."}, {"t": "tf", "q": "In the event of a conflict between obligations under the United Nations Charter and another international treaty, the latter always prevails.", "a": false, "e": "Under Article 103, obligations under the Charter prevail over conflicting treaty obligations."}, {"t": "tf", "q": "A treaty provision may develop into a rule of customary international law that becomes applicable to non-contracting states.", "a": true, "e": "A treaty rule can become customary law, and customary law can then apply to states that are not parties to the treaty."}, {"t": "tf", "q": "States may freely derogate from rules of jus cogens through mutual agreement.", "a": false, "e": "Jus cogens rules permit no derogation, even by mutual agreement."}, {"t": "tf", "q": "A violation of domestic law concerning treaty-making authority automatically invalidates a treaty, regardless of the seriousness or visibility of the violation.", "a": false, "e": "Such a violation can be invoked only where it was manifest and concerned a rule of fundamental importance."}, {"t": "tf", "q": "Fraudulent conduct used to induce another state to conclude a treaty may constitute a defect of consent.", "a": true, "e": "Fraud is a recognized defect of consent that can affect a treaty's validity."}, {"t": "tf", "q": "Secret restrictions on a state representative's authority can always be invoked to invalidate the state's consent to a treaty.", "a": false, "e": "Restrictions that were not made known to the other parties generally cannot be invoked to invalidate consent."}, {"t": "tf", "q": "A treaty concluded through the unlawful threat or use of force is void.", "a": true, "e": "A treaty procured by the unlawful threat or use of force is void."}, {"t": "tf", "q": "A state may invoke impossibility of performance to terminate a treaty even when the impossibility results from its own breach of an international obligation.", "a": false, "e": "A state cannot rely on impossibility of performance when the impossibility results from its own breach."}, {"t": "tf", "q": "A fundamental change of circumstances cannot be invoked as a ground for terminating a treaty that establishes a territorial boundary.", "a": true, "e": "A treaty establishing a boundary is expressly excluded from termination on the ground of fundamental change of circumstances."}, {"t": "mc", "q": "What is the general rule concerning the effects of treaties on third states?", "o": ["Treaties automatically bind all states.", "Treaties create obligations but not rights for third states.", "Treaties create neither rights nor obligations for third states without their consent.", "Treaties bind third states whenever the United Nations approves them."], "a": 2, "e": "Without their consent, treaties create neither rights nor obligations for third states."}, {"t": "mc", "q": "Which of the following is required for a treaty to confer a legal right upon a third state?", "o": ["The third state must become a contracting party.", "The contracting parties must intend to confer the right upon the third state.", "The third state must obtain approval from the International Court of Justice.", "The treaty must concern international trade."], "a": 1, "e": "A right arises for a third state where the contracting parties intend to confer it."}, {"t": "mc", "q": "For a treaty to impose an obligation upon a third state, the third state's acceptance must be:", "o": ["Presumed from its silence.", "Expressly given in writing.", "Approved by a majority of contracting states.", "Given verbally without any formal requirements."], "a": 1, "e": "Obligations require the third state's express acceptance in writing. Silence is not enough."}, {"t": "mc", "q": "What is the principal purpose of a most-favored-nation clause?", "o": ["To guarantee that the beneficiary state receives treatment no less favorable than that granted to a third state in the agreed sphere.", "To prevent states from concluding new treaties.", "To grant exclusive privileges to the most economically powerful state.", "To eliminate all international trade restrictions automatically."], "a": 0, "e": "The clause ensures the beneficiary state is treated no less favorably than any third state in the agreed sphere."}, {"t": "mc", "q": "State A and State B are parties to two successive treaties concerning the same subject. Both treaties remain in force, but their provisions conflict. Which rule generally applies when no express provision resolves the conflict?", "o": ["The earlier treaty always prevails.", "Both treaties automatically become void.", "The later treaty prevails over incompatible provisions of the earlier treaty.", "Neither treaty can be applied without judicial approval."], "a": 2, "e": "Where no express provision resolves the conflict, the later treaty prevails over incompatible provisions of the earlier one."}, {"t": "mc", "q": "Under Article 103 of the United Nations Charter, what happens when a state's obligations under the Charter conflict with its obligations under another international treaty?", "o": ["The more recent treaty prevails.", "The obligations under the United Nations Charter prevail.", "Both sets of obligations become invalid.", "The state may freely choose which obligations to fulfill."], "a": 1, "e": "Article 103 gives priority to obligations under the Charter."}, {"t": "mc", "q": "Which of the following best describes the relationship between treaties and customary international law?", "o": ["Customary international law is always superior to treaties.", "Treaties can never influence customary international law.", "Treaty provisions may develop into customary international law through state practice and general acceptance.", "Customary international law applies exclusively to treaty parties."], "a": 2, "e": "Treaty provisions can become customary law through state practice and general acceptance."}, {"t": "mc", "q": "Which statement concerning jus cogens is correct?", "o": ["States may disregard jus cogens through bilateral agreements.", "Jus cogens rules apply only to members of the United Nations.", "Jus cogens rules may be modified by ordinary treaty provisions.", "Jus cogens rules permit no derogation and may be modified only by subsequent norms of the same character."], "a": 3, "e": "Jus cogens rules allow no derogation and can be modified only by later norms of the same character."}, {"t": "mc", "q": "A state representative concludes a treaty in violation of an internal constitutional rule. Under what circumstances may the state invoke this violation to challenge its consent?", "o": ["Whenever any domestic legal provision has been violated.", "Only when the violation was manifest and concerned a rule of fundamental importance.", "Whenever the government changes after the treaty is signed.", "Only when the treaty creates financial obligations."], "a": 1, "e": "The violation may be invoked only if it was manifest and concerned a rule of fundamental importance."}, {"t": "mc", "q": "Which of the following circumstances may justify invalidating consent to a treaty on the ground of error?", "o": ["An error concerning only the interpretation of international law.", "A minor spelling mistake in the treaty.", "An error concerning an essential factual situation that formed the basis of the state's consent, provided the state did not contribute to the error.", "An error discovered after the state deliberately supplied incorrect information."], "a": 2, "e": "Error is a ground only where it concerns an essential factual basis of consent and the state did not contribute to it."}, {"t": "mc", "q": "State X secretly offers a substantial financial reward to State Y's representative to obtain State Y's consent to a treaty. Which ground of invalidity may State Y invoke?", "o": ["Fundamental change of circumstances.", "Corruption of a state representative.", "Impossibility of performance.", "Lapse of time."], "a": 1, "e": "Obtaining consent through a bribe to a representative is corruption of a state representative."}, {"t": "mc", "q": "A treaty contains no provision concerning withdrawal or denunciation. Under which circumstances may a party withdraw by giving at least twelve months' notice?", "o": ["Whenever the treaty becomes economically inconvenient var TOTAL=QS.length;
var order=[],idx=0,correct=0,answered=false;
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["s-start","s-quiz","s-end"].forEach(function(s){$(s).classList.toggle("on",s===id)});
  $("app").classList.toggle("mini",id==="s-quiz");window.scrollTo({top:0,behavior:"smooth"})}
var tf=QS.filter(function(q){return q.t==="tf"}).length;
$("nTotal").textContent=TOTAL;$("nTF").textContent=tf;$("nMC").textContent=TOTAL-tf;
function start(){
  order=shuffle(QS.map(function(q,i){return i}));
  idx=0;correct=0;show("s-quiz");render();
}
function render(){
  answered=false;
  var q=QS[order[idx]];
  $("prog").textContent="Question "+(idx+1)+" of "+TOTAL;
  $("sc").textContent=correct+" correct";
  $("barfill").style.width=(idx/TOTAL*100)+"%";
  $("type").textContent=q.t==="tf"?"True or False":"Multiple Choice";
  $("qtext").textContent=q.t==="tf"?"True or False: "+q.q:q.q;
  var items;
  if(q.t==="tf"){items=[{x:"True",c:q.a===true},{x:"False",c:q.a===false}]}
  else{items=shuffle(q.o.map(function(x,i){return{x:x,c:i===q.a}}))}
  var box=$("opts");box.innerHTML="";
  items.forEach(function(it,i){
    var b=document.createElement("button");b.type="button";b.className="opt";b.dataset.c=it.c?"1":"0";
    var l=document.createElement("span");l.className="l";l.textContent="ABCD".charAt(i);
    var t=document.createElement("span");t.textContent=it.x;
    b.appendChild(l);b.appendChild(t);
    b.addEventListener("click",function(){pick(b,it,items)});
    box.appendChild(b);
  });
  $("fb").className="fb";$("fb").innerHTML="";
  $("nextrow").classList.remove("on");
  $("nextBtn").textContent=idx===TOTAL-1?"SEE MY SCORE":"NEXT QUESTION";
}
function pick(btn,it,items){
  if(answered)return;answered=true;
  var q=QS[order[idx]];
  var all=document.querySelectorAll(".opt");
  all.forEach(function(b){b.disabled=true;if(b.dataset.c==="1")b.classList.add("correct");else if(b!==btn)b.classList.add("dim")});
  var fb=$("fb");fb.innerHTML="";var h=document.createElement("b"),p=document.createElement("div");
  if(it.c){correct++;fb.className="fb ok";h.textContent="Correct!"}
  else{btn.classList.add("wrong");fb.className="fb no";h.textContent="Incorrect"}
  p.textContent=q.e;fb.appendChild(h);fb.appendChild(p);
  $("sc").textContent=correct+" correct";
  $("barfill").style.width=((idx+1)/TOTAL*100)+"%";
  $("nextrow").classList.add("on");
  setTimeout(function(){$("nextrow").scrollIntoView({behavior:"smooth",block:"nearest"})},120);
}
function next(){if(!answered)return;if(idx<TOTAL-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else finish()}
function finish(){
  show("s-end");
  var p=Math.round(correct/TOTAL*100);
  $("pct").textContent=correct+" / "+TOTAL;
  $("frac").textContent=p+"%";
  $("ring").style.setProperty("--p",p);
  $("msg").textContent=p>=90?"Outstanding work!":p>=75?"Very good performance!":p>=60?"Good effort, keep practicing.":"Review the material and try again.";
}
$("startBtn").addEventListener("click",start);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",start);
document.addEventListener("keydown",function(e){
  if(!$("s-quiz").classList.contains("on"))return;
  if(e.key==="Enter"){next();return}
  var k="abcd".indexOf(e.key.toLowerCase());
  if(k>=0&&!answered){var o=document.querySelectorAll(".opt");if(o[k])o[k].click()}
});
})();
</script>
