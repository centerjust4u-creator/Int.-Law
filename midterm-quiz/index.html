<style>
:root{
  --navy-0:#060b18;
  --navy-1:#0b1428;
  --navy-2:#13213f;
  --navy-3:#1c2e55;
  --brass:#c9a54c;
  --brass-hi:#e8cf86;
  --brass-lo:#8a6d27;
  --parch:#f4ead3;
  --parch-2:#eadcb9;
  --ink:#231a0e;
  --ink-soft:#5b4a2e;
  --blue:#2563c9;
  --blue-soft:#dbe7fb;
  --red:#b8322a;
  --red-soft:#f7dcd8;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Source Sans 3","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--sans);
  color:var(--parch);
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(201,165,76,.13), transparent 60%),
    radial-gradient(900px 600px at 100% 110%, rgba(37,99,201,.10), transparent 60%),
    linear-gradient(180deg,var(--navy-1),var(--navy-0));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 14px);
}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:fade .45s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- ornaments ---------- */
.rule{display:flex;align-items:center;gap:12px;color:var(--brass);margin:18px auto;max-width:320px;width:100%}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.rule span{font-size:14px;letter-spacing:.3em}

/* ---------- intro ---------- */
.intro{justify-content:center;align-items:center;text-align:center;padding:12px 0}
.crest{width:min(200px,52vw);aspect-ratio:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(201,165,76,.25));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:var(--brass-hi);margin-top:12px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1.08;color:var(--parch);margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.subtitle{color:#cdd5e6;font-size:17px;max-width:460px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 8px}
.stat{border:1px solid rgba(201,165,76,.45);background:rgba(19,33,63,.65);border-radius:14px;padding:12px 18px;min-width:118px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--brass-hi)}
.stat small{display:block;margin-top:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#aab4c9}
.mode{margin:18px auto 4px;display:inline-flex;padding:4px;border-radius:999px;background:rgba(6,11,24,.7);border:1px solid rgba(201,165,76,.35)}
.mode button{border:0;background:transparent;color:#c3cbdc;font:600 15px var(--sans);padding:10px 18px;border-radius:999px;cursor:pointer;min-height:44px;transition:.2s}
.mode button[aria-pressed="true"]{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--navy-0)}
.btn{
  appearance:none;border:0;cursor:pointer;font:700 17px var(--sans);letter-spacing:.04em;
  padding:16px 34px;border-radius:14px;min-height:54px;
  color:var(--navy-0);
  background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,var(--brass-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 24px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.25);
  transition:transform .15s,box-shadow .2s,filter .2s;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.choice:focus-visible,.mode button:focus-visible{outline:3px solid var(--brass-hi);outline-offset:3px}
.btn.start{margin-top:22px;font-size:19px;padding:18px 54px}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:6px 2px 14px;border-bottom:1px solid rgba(201,165,76,.25)}
.topbar img{width:48px;height:48px;flex:none}
.topbar .t1{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-hi);line-height:1.1}
.topbar .t2{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--parch);line-height:1.15}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 8px;font-size:15px;color:#c3cbdc}
.hud b{color:var(--parch)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(37,99,201,.16);border:1px solid rgba(98,146,230,.45);color:#cfe0ff;font-weight:600}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#6aa0ff;box-shadow:0 0 8px #6aa0ff}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(201,165,76,.2)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi));transition:width .45s ease}

/* ---------- card ---------- */
.card{
  position:relative;margin-top:20px;border-radius:18px;padding:30px 24px 24px;color:var(--ink);
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.55), transparent 50%),
    linear-gradient(160deg,var(--parch),var(--parch-2));
  box-shadow:0 0 0 1px rgba(138,109,39,.6),0 0 0 6px rgba(11,20,40,.9),0 0 0 7px rgba(201,165,76,.55),0 24px 50px rgba(0,0,0,.5);
}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(138,109,39,.35);border-radius:12px;pointer-events:none}
.qno{display:inline-block;font:700 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--brass-lo);margin-bottom:12px}
.qtext{font-family:var(--serif);font-weight:600;font-size:clamp(22px,4.4vw,28px);line-height:1.3}
.qtext em{font-style:italic;color:#5a3d0c}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.choice{
  position:relative;cursor:pointer;min-height:70px;border-radius:14px;
  font:700 19px var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:rgba(255,255,255,.55);
  border:2px solid rgba(138,109,39,.45);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;
}
.choice .key{font:600 12px var(--sans);letter-spacing:0;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1px solid rgba(91,74,46,.4);color:var(--ink-soft)}
.choice:hover:not(:disabled){transform:translateY(-2px);background:#fff;border-color:var(--brass-lo);box-shadow:0 8px 18px rgba(80,55,10,.18)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--blue-soft);border-color:var(--blue);color:#0f3a85;box-shadow:0 0 0 3px rgba(37,99,201,.25)}
.choice.wrong{background:var(--red-soft);border-color:var(--red);color:#7d1b15;animation:shake .4s}
.choice.dim{opacity:.45}
.choice .mark{font-size:20px;line-height:1}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.feedback{display:none;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px dashed rgba(138,109,39,.45)}
.feedback.show{display:flex;animation:fade .3s ease}
.verdict{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:24px}
.verdict .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 18px var(--sans)}
.verdict.ok{color:var(--blue)} .verdict.ok .ic{background:var(--blue)}
.verdict.no{color:var(--red)} .verdict.no .ic{background:var(--red)}
.verdict small{display:block;font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink-soft)}
.btn.next{padding:14px 26px;font-size:16px}

/* ---------- results ---------- */
.results{align-items:center;text-align:center;padding-top:8px}
.results .crest{width:min(150px,40vw);animation:none}
.ring{position:relative;width:200px;height:200px;margin:18px auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .val{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center}
.ring .score{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1;color:var(--parch)}
.ring .pct{color:var(--brass-hi);font-weight:700;letter-spacing:.08em;margin-top:6px}
.msg{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--parch);margin-top:6px}
.sub{color:#aab4c9;margin-top:2px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn.ghost{background:transparent;color:var(--brass-hi);box-shadow:0 0 0 1.5px var(--brass) inset}
.review{width:100%;text-align:left;margin-top:28px;display:none}
.review.show{display:block}
.review h3{font-family:var(--serif);font-size:24px;color:var(--brass-hi);margin-bottom:12px;text-align:center}
.rv{background:rgba(19,33,63,.7);border:1px solid rgba(201,165,76,.25);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rv p{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--parch)}
.rv p em{color:var(--brass-hi)}
.rv .ans{margin-top:8px;font-size:14px;color:#aab4c9;display:flex;gap:14px;flex-wrap:wrap}
.rv .ans b.t{color:#8fb6ff} .rv .ans b.f{color:#ff9a90}
.foot{text-align:center;color:#6f7b94;font-size:13px;margin-top:28px;letter-spacing:.06em}
.perfect{color:var(--brass-hi);font-family:var(--serif);font-size:20px;margin-top:20px}

@media (max-width:520px){
  .card{padding:24px 18px 20px}
  .choices{gap:10px}
  .choice{min-height:64px;font-size:17px}
  .choice .key{display:none}
  .feedback .btn.next{width:100%}
  .topbar .t2{font-size:18px}
  .hud{font-size:14px}
  .stat{min-width:100px;padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
