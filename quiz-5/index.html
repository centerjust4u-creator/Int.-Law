<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Law Quiz 5 · Center JUST</title>
<style>
:root{--navy:#060E24;--navy2:#0B1736;--gold:#D6B158;--gold2:#B8923A;--parch:#F6EFDD;--parch2:#EBE0C4;--ink:#1B2236;--blue:#2454BE;--red:#C93636;--mut:#A9B6D3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:#F4F7FC;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--navy);position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 100% 0%,rgba(36,84,190,.28),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(214,177,88,.07),transparent 60%),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%),#060E24}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.serif{font-family:Georgia,"Times New Roman",serif}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(214,177,88,.55)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;object-fit:contain;flex:none}
.brand b{font-family:Georgia,serif;font-size:20px;color:var(--gold);letter-spacing:.5px;white-space:nowrap}
.tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:3px;margin:10px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
.screen{display:none;animation:fade .4s}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(214,177,88,.35);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:28px 22px;text-align:center}
.hero{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.cj{font-family:Georgia,serif;color:var(--gold);font-size:26px;letter-spacing:3px;margin:6px 0 2px;text-transform:uppercase}
.rule{width:70px;height:2px;background:var(--gold);margin:14px auto;border-radius:2px}
h1{font-family:Georgia,serif;font-weight:700;font-size:34px;margin:8px 0;line-height:1.15}
.sub{color:var(--mut);font-size:17px;margin:0 auto 18px;max-width:480px;line-height:1.5}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 24px}
.chip{border:1px solid rgba(214,177,88,.5);color:var(--gold);padding:7px 14px;border-radius:999px;font-size:14px;background:rgba(214,177,88,.07)}
.btn{font:inherit;font-weight:700;letter-spacing:.5px;cursor:pointer;border:0;border-radius:12px;padding:15px 30px;font-size:17px;min-height:52px;color:#1b1405;background:linear-gradient(180deg,#E6C675,var(--gold2));box-shadow:0 4px 18px rgba(214,177,88,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(214,177,88,.4)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;border:2px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 4px rgba(214,177,88,.18);padding:24px 20px}
.meta{display:flex;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:1px;color:#7a5f1c;text-transform:uppercase;margin-bottom:6px;gap:8px}
.kind{display:inline-block;font-size:12px;letter-spacing:2px;color:#7a5f1c;border:1px solid #b8923a;border-radius:999px;padding:3px 10px;margin:8px 0 4px;text-transform:uppercase}
.q{font-family:Georgia,serif;font-size:22px;line-height:1.45;margin:10px 0 18px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;font:inherit;font-size:17px;line-height:1.4;color:var(--ink);background:#FFFBF0;border:2px solid #cdbb88;border-radius:12px;padding:13px 14px;min-height:56px;cursor:pointer;transition:all .18s}
.opt:hover:not(:disabled){border-color:var(--gold2);transform:translateX(4px);background:#fff}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy2);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.right{background:var(--blue);border-color:#173a8a;color:#fff}
.opt.right .l{background:#fff;color:var(--blue)}
.opt.wrong{background:var(--red);border-color:#8f1f1f;color:#fff;animation:shake .4s}
.opt.wrong .l{background:#fff;color:var(--red)}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;line-height:1.5;display:none;animation:fade .3s}
.fb.ok{display:block;background:rgba(36,84,190,.12);border-left:5px solid var(--blue)}
.fb.no{display:block;background:rgba(201,54,54,.1);border-left:5px solid var(--red)}
.fb b{display:block;font-family:Georgia,serif;font-size:18px;margin-bottom:3px}
.nxt{display:flex;justify-content:flex-end;margin-top:16px;min-height:52px}
.score{font-family:Georgia,serif;font-size:76px;color:var(--gold);line-height:1;margin:8px 0}
.rev{text-align:left;margin-top:26px;display:grid;gap:10px}
.rev div{background:rgba(255,255,255,.05);border-left:4px solid var(--blue);border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.45}
.rev div.x{border-color:var(--red)}
.rev small{display:block;color:var(--mut);margin-top:4px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
footer{text-align:center;color:var(--mut);font-size:13px;letter-spacing:1px;margin-top:28px}
@media(max-width:520px){h1{font-size:27px}.q{font-size:19px}.opt{font-size:16px}.hero{width:140px;height:140px}.tag{display:none}.score{font-size:62px}.btn{width:100%}.nxt .btn{width:100%}}
</style>
</head>

var TF=[["A reservation is a unilateral declaration made by a state to exclude or modify the legal effects of certain treaty provisions.", true, "A reservation is a unilateral declaration by a state whose aim is to exclude or modify the legal effects of certain treaty provisions."], ["An interpretative declaration allows a state to derogate from the provisions of a treaty.", false, "An interpretative declaration only clarifies how a state understands certain treaty provisions; it does not allow derogation from them."], ["A reservation made only during treaty negotiations is considered a formal reservation with legal effects.", false, "A state can formally formulate a reservation when signing, ratifying, accepting, approving, or acceding to a treaty, not merely during negotiations."], ["A reservation may be formulated when signing, ratifying, accepting, approving, or acceding to a treaty.", true, "These are the stages at which a state can formally formulate a reservation."], ["A late reservation becomes valid even if one contracting party objects to it.", false, "If one contracting state objects to the late formulation of a reservation, the reservation is prevented from producing its effects."], ["According to the traditional doctrine, a reservation must be accepted by all other contracting parties to be valid.", true, "The traditional doctrine rests on the principle of the integrity of the convention, so all other contracting parties must accept the reservation."], ["The flexible doctrine allows each contracting state to decide individually whether to accept or reject a reservation.", true, "Under the flexible doctrine, states accept or reject reservations individually, which encourages wider participation in treaties."], ["The International Court of Justice endorsed the compatibility of reservations with the object and purpose of a treaty in 1969.", false, "The Court endorsed this theory in 1951, not in 1969."], ["The absence of a provision concerning reservations in a multilateral treaty automatically prohibits states from making reservations.", false, "Where a treaty is silent, only a reservation that is incompatible with the object and purpose of the treaty is prohibited."], ["A reservation expressly authorized by a treaty requires subsequent acceptance by all other contracting parties.", false, "A reservation expressly authorized by the treaty does not require subsequent acceptance by the other contracting parties."], ["A reservation to the constitutive instrument of an international organization requires acceptance by the organization's competent organ.", true, "For the constitutive instrument of an international organization, the competent organ of the organization must accept the reservation."], ["A reservation is considered accepted if no objection is raised within twelve months.", true, "If no objection is raised within twelve months, the reservation is considered accepted."], ["A reservation modifies the provisions of a treaty for all contracting states, including those that have not accepted it.", false, "A reservation does not modify the treaty for states that have not accepted it; with an objecting state, the treaty enters into force except for the clauses affected by the reservation."], ["Unless the treaty provides otherwise, a reservation or an objection to a reservation may be withdrawn unilaterally at any time.", true, "Unless the treaty provides otherwise, withdrawal can be made unilaterally at any time, and it takes effect when the interested state receives notice."], ["A reservation made when signing a treaty subject to ratification does not need to be formally confirmed when the state expresses its consent to be bound.", false, "The reservation must be formally confirmed when the state expresses its consent to be bound by the treaty."]], MC=[["What is the primary purpose of a reservation to an international treaty?", ["To terminate the entire treaty", "To exclude or modify the legal effects of certain treaty provisions", "To establish a new international organization", "To prevent other states from joining the treaty"], 1, "A reservation aims to exclude or modify the legal effects of certain treaty provisions."], ["Which of the following best describes an interpretative declaration?", ["A declaration that automatically invalidates a treaty", "A statement that excludes all treaty obligations", "A statement clarifying how a state understands certain treaty provisions", "A declaration requiring unanimous acceptance by all states"], 2, "An interpretative declaration clarifies how a state understands treaty provisions; it does not exclude or modify them."], ["At which stage can a state formally formulate a reservation?", ["Only during negotiations", "Only after the treaty enters into force", "Only after obtaining approval from the International Court of Justice", "When signing, ratifying, accepting, approving, or acceding to a treaty"], 3, "A reservation may be formulated when signing, ratifying, accepting, approving, or acceding to a treaty."], ["What happens if one contracting state objects to the late formulation of a reservation?", ["The reservation automatically becomes valid", "The reservation is prevented from producing its effects", "The treaty is automatically terminated", "The objection has no legal significance"], 1, "A single objection to a late reservation prevents it from producing its effects."], ["The traditional doctrine concerning reservations is based on which principle?", ["The principle of sovereign equality", "The principle of territorial integrity", "The principle of the integrity of the convention", "The principle of diplomatic immunity"], 2, "The traditional doctrine rests on the integrity of the convention, so a reservation needs acceptance by all parties."], ["According to the flexible doctrine, what is one major advantage of allowing states to accept or reject reservations individually?", ["It guarantees that all treaty provisions remain identical for every state", "It encourages wider participation in international treaties", "It eliminates the need for treaty negotiations", "It requires unanimous acceptance of every reservation"], 1, "Individual acceptance or rejection makes states more willing to join, encouraging wider participation."], ["Under the third theory of reservations, a reservation is permitted when it:", ["Is compatible with the object and purpose of the treaty", "Is accepted only by the reserving state", "Is made after the treaty has expired", "Modifies every essential provision of the treaty"], 0, "The third theory permits reservations that are compatible with the object and purpose of the treaty."], ["In which year did the International Court of Justice endorse the theory that reservations must be compatible with the object and purpose of a treaty?", ["1945", "1951", "1969", "1986"], 1, "The Court endorsed this theory in 1951."], ["Under the 1969 Vienna Convention, which of the following reservations is prohibited?", ["A reservation expressly authorized by the treaty", "A reservation compatible with the treaty's object and purpose", "A reservation that is incompatible with the object and purpose of a treaty that is silent on reservations", "A reservation accepted by the other contracting parties"], 2, "Where a treaty is silent, a reservation incompatible with its object and purpose is prohibited."], ["Which of the following reservations does NOT require subsequent acceptance by the other contracting parties?", ["A reservation expressly authorized by the treaty", "A reservation prohibited by the treaty", "A reservation incompatible with the treaty's purpose", "A reservation made only during negotiations"], 0, "A reservation expressly authorized by the treaty needs no subsequent acceptance by the other parties."], ["A reservation to the constitutive instrument of an international organization requires acceptance by:", ["Every member of the United Nations", "The International Court of Justice", "The competent organ of the international organization", "The reserving state alone"], 2, "The competent organ of the international organization must accept such a reservation."], ["If no objection is raised to a reservation, after what period is it considered accepted?", ["Three months", "Six months", "Twelve months", "Twenty-four months"], 2, "A reservation is considered accepted if no objection is raised within twelve months."], ["According to the stated legal effects of reservations, what happens to treaty provisions affected by a reservation in relations between the reserving and objecting states?", ["The entire treaty is automatically terminated", "The treaty enters into force except for the clauses affected by the reservation", "All treaty provisions become invalid for every contracting state", "The objecting state automatically accepts all reserved provisions"], 1, "The treaty enters into force between them, except for the clauses affected by the reservation."], ["When does the withdrawal of a reservation or an objection become effective?", ["Immediately after the state decides to withdraw it", "When the withdrawal is announced publicly", "When the International Court of Justice approves it", "When the interested state receives notice of the withdrawal"], 3, "Withdrawal takes effect when the interested state receives notice of it."], ["A state formulates a reservation when signing a treaty that is subject to ratification. What must the state do for the reservation to satisfy the procedural requirements?", ["Obtain unanimous approval from all United Nations members", "Formally confirm the reservation when expressing its consent to be bound by the treaty", "Wait twelve months before ratifying the treaty", "Submit the reservation exclusively to the International Court of Justice"], 1, "The state must formally confirm the reservation when it expresses its consent to be bound."]];
var Q=[];
TF.forEach(function(t){Q.push({t:"tf",q:t[0],a:t[1],e:t[2]})});
MC.forEach(function(m){Q.push({t:"mc",q:m[0],o:m[1],a:m[2],e:m[3]})});
var N=Q.length;
var $=function(i){return document.getElementById(i)};
$("cTot").textContent=N+" Questions";$("cTF").textContent=TF.length+" True / False";$("cMC").textContent=MC.length+" Multiple Choice";
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var deck,idx,score,locked,log;
function show(id){["intro","play","end"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
function begin(){
 deck=shuffle(Q).map(function(q){
  if(q.t==="tf")return q;
  var order=shuffle([0,1,2,3]);
  return {t:"mc",q:q.q,o:order.map(function(i){return q.o[i]}),a:order.indexOf(q.a),e:q.e};
 });
 idx=0;score=0;log=[];show("play");render();
}
function render(){
 var q=deck[idx];locked=false;
 $("prog").textContent="Question "+(idx+1)+" of "+N;
 $("sc").textContent=score+" correct";
 $("bar").style.width=(idx/N*100)+"%";
 $("kind").textContent=q.t==="tf"?"True or False":"Multiple Choice";
 $("q").textContent=q.q;
 var fb=$("fb");fb.className="fb";fb.innerHTML="";
 $("next").style.display="none";
 var box=$("opts");box.innerHTML="";
 var opts=q.t==="tf"?["True","False"]:q.o;
 opts.forEach(function(txt,i){
  var b=document.createElement("button");b.className="opt";b.type="button";
  var l=document.createElement("span");l.className="l";l.textContent=String.fromCharCode(65+i);
  var s=document.createElement("span");s.textContent=txt;
  b.appendChild(l);b.appendChild(s);b.onclick=function(){pick(i)};box.appendChild(b);
 });
}
function correctIdx(q){return q.t==="tf"?(q.a===true?0:1):q.a}
function pick(i){
 if(locked)return;locked=true;
 var q=deck[idx],c=correctIdx(q),ok=(i===c),bs=$("opts").children;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;
  if(k===c)bs[k].classList.add("right");else if(k===i)bs[k].classList.add("wrong");else bs[k].classList.add("dim")}
 if(ok)score++;
 var opts=q.t==="tf"?["True","False"]:q.o;
 log.push({q:q.q,ok:ok,mine:opts[i],right:opts[c]});
 $("sc").textContent=score+" correct";
 var fb=$("fb");fb.className="fb "+(ok?"ok":"no");
 fb.innerHTML="";
 var h=document.createElement("b");h.textContent=ok?"Correct!":"Not quite.";fb.appendChild(h);
 if(!ok){var p=document.createElement("div");p.textContent="Correct answer: "+opts[c];p.style.fontWeight="700";p.style.marginBottom="4px";fb.appendChild(p)}
 var e=document.createElement("div");e.textContent=q.e;fb.appendChild(e);
 var n=$("next");n.style.display="";n.textContent=idx===N-1?"See result":"Next question";n.focus({preventScroll:true});
 fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){if(!locked)return;if(idx===N-1){finish()}else{idx++;render()}}
function finish(){
 $("bar").style.width="100%";
 $("fs").textContent=score+" / "+N;
 var pct=Math.round(score/N*100);
 $("fm").textContent=pct+"% correct"+(pct===100?" — outstanding!":pct>=70?" — well done!":" — keep practicing!");
 var r=$("rev");r.innerHTML="";
 log.forEach(function(l,i){
  var d=document.createElement("div");if(!l.ok)d.className="x";
  var t=document.createElement("span");t.textContent=(i+1)+". "+l.q;d.appendChild(t);
  var s=document.createElement("small");s.textContent=l.ok?"Your answer: "+l.mine+" ✓":"Your answer: "+l.mine+" ✗  ·  Correct: "+l.right;d.appendChild(s);r.appendChild(d);
 });
 show("end");
}
$("start").onclick=begin;$("restart").onclick=begin;$("next").onclick=next;
document.addEventListener("keydown",function(e){
 if(!$("play").classList.contains("on"))return;
 if(e.key==="Enter"&&locked){e.preventDefault();next();return}
 if(!locked){var k=e.key.toUpperCase().charCodeAt(0)-65,bs=$("opts").children;if(e.key.length===1&&k>=0&&k<bs.length)pick(k)}
});
})();
</script>
